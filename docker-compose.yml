version: "3.9"

# ============================================================
# GUARDIAN AI — Client Production Docker Compose
#
# TIER 1 (default):
#   docker compose up -d
#   Database: SQLite (zero config)
#
# TIER 2 (Enterprise/MSSP/Government):
#   docker compose --profile tier2 up -d
#   Database: PostgreSQL + Redis
#   guardian.yml tier2 block:
#     tier2:
#       db_mode: distributed
#       postgres_url: postgresql://guardian:PASS@guardian-postgres:5432/guardian
#       redis_url: redis://:PASS@guardian-redis:6379/0
#       mtls:
#         enabled: false
#       ebpf_enabled: false
# ============================================================

services:

  guardian-core:
    image: ghcr.io/p2nshooter/guardian-engine:latest
    container_name: guardian-core
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./guardian.yml:/guardian/config/guardian.yml:ro
      - guardian-data:/guardian/data
      - guardian-logs:/guardian/logs
      - ./certs:/guardian/certs:ro
    environment:
      - GUARDIAN_CONFIG=/guardian/config/guardian.yml
      - GUARDIAN_ROLE=core
      - GUARDIAN_DB_MODE=${GUARDIAN_DB_MODE:-sqlite}
      - GUARDIAN_POSTGRES_URL=${GUARDIAN_POSTGRES_URL:-}
      - GUARDIAN_REDIS_URL=${GUARDIAN_REDIS_URL:-redis://guardian-redis:6379/0}
      - GUARDIAN_MTLS_ENABLED=${GUARDIAN_MTLS_ENABLED:-false}
      - GUARDIAN_EBPF_ENABLED=${GUARDIAN_EBPF_ENABLED:-false}
    depends_on:
      guardian-postgres:
        condition: service_healthy
        required: false
      guardian-redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - guardian-net
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }

  guardian-node:
    image: ghcr.io/p2nshooter/guardian-engine:latest
    container_name: guardian-node
    restart: unless-stopped
    command: python -m src
    depends_on:
      guardian-core:
        condition: service_healthy
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
      - KILL
      - SYS_ADMIN
    environment:
      - GUARDIAN_CORE_URL=http://guardian-core:8080
      - GUARDIAN_NODE_NAME=${HOSTNAME:-node-1}
      - GUARDIAN_REPORT_INTERVAL=60
      - GUARDIAN_SCAN_MODE=auto
      - GUARDIAN_SCAN_PATHS=/host,/host/tmp,/host/var/www
      - GUARDIAN_QUARANTINE_DIR=/guardian/quarantine
      - GUARDIAN_MTLS_ENABLED=${GUARDIAN_MTLS_ENABLED:-false}
      - GUARDIAN_MTLS_CERT_PATH=/guardian/certs/node.crt
      - GUARDIAN_MTLS_KEY_PATH=/guardian/certs/node.key
      - GUARDIAN_MTLS_CA_PATH=/guardian/certs/ca.crt
      - GUARDIAN_EBPF_ENABLED=${GUARDIAN_EBPF_ENABLED:-false}
    volumes:
      - /:/host
      - /tmp:/tmp
      - guardian-quarantine:/guardian/quarantine
      - ./guardian.yml:/guardian/config/guardian.yml:ro
      - ./certs:/guardian/certs:ro
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
      - /sys/kernel/debug:/sys/kernel/debug
    networks:
      - guardian-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── TIER 2: PostgreSQL ─────────────────────────────────────────────────────
  guardian-postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    restart: unless-stopped
    profiles: ["tier2"]
    environment:
      POSTGRES_DB:       guardian
      POSTGRES_USER:     guardian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardian_change_in_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - guardian-postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - guardian-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── TIER 2: Redis ──────────────────────────────────────────────────────────
  guardian-redis:
    image: redis:7-alpine
    container_name: guardian-redis
    restart: unless-stopped
    profiles: ["tier2"]
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
      --requirepass ${REDIS_PASSWORD:-guardian_redis_change_in_prod}
    volumes:
      - guardian-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning",
             "-a", "${REDIS_PASSWORD:-guardian_redis_change_in_prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - guardian-net
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "3" }

  # ── DEV ONLY: pgAdmin ──────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guardian-pgadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@guardian.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - guardian-net
    depends_on:
      - guardian-postgres

volumes:
  guardian-data:
  guardian-logs:
  guardian-quarantine:
  guardian-postgres-data:
  guardian-redis-data:

networks:
  guardian-net:
    driver: bridge
