# AXTO Platform — GitLab CI/CD Pipeline v3.0 (HARDENED + SMART REBUILD)
#
# WHAT CHANGED IN v3.0 (see AXTO_CICD_Hardening_Report.pdf for full detail):
#   1. SMART REBUILD: on every push to main, each product's Docker image AND
#      .exe are only rebuilt if files under that product's own folder (or
#      this file) actually changed since the last commit on this branch —
#      using GitLab's native `rules:changes:`. A push that only touches the
#      dashboard, for example, no longer rebuilds all 13 product images.
#   2. orchestra-worker-gpu is now COMPLETELY EXCLUDED from automatic builds
#      (push to main, BUILD_PRODUCT=all). It can only be built by an admin
#      explicitly selecting it (BUILD_PRODUCT=orchestra-worker-gpu), and even
#      then requires one extra manual confirmation click in the pipeline UI
#      (`when: manual`) before it actually runs — this is intentional, do not
#      remove, until GPU build infrastructure is verified ready.
#   3. FIXED: the previous "build-exe" stage built a LINUX binary (image:
#      python:3.11, a Linux container) and uploaded it to
#      builds/latest/exe/<product>-linux — which the dashboard's download
#      route never looked for (it expects
#      builds/latest/exe/<product>-windows.exe). Every .exe "build" was
#      therefore silently undownloadable. EXE jobs now run on a Windows
#      GitLab Runner (tag: windows) and upload to the correct path. You MUST
#      register at least one Windows runner with the `windows` tag for these
#      jobs to run — see docs/admin/SETUP_CI_CD.md.
#   4. ADDED: antivirus-core was a product the dashboard's Engine Builder
#      already listed as buildable, but no matching GitLab job existed for
#      it at all — clicking "Build" for it silently did nothing. Added.
#   5. Docker build jobs now also check $BUILD_TYPE (image/exe/both) so that
#      requesting only an .exe build for one product no longer also
#      triggers an unwanted Docker image build for that same product.
#
# STAGES:
#   1. build-images   → Docker images, smart-rebuild, GPU worker excluded
#   2. push-registry  → Push to GitLab Container Registry
#   3. upload-r2      → Upload .tar.gz to Cloudflare R2 (axto-builds bucket)
#   4. build-exe      → Real Windows .exe via PyInstaller (Windows runner)
#   5. deploy-cf      → Dashboard → CF Pages + Workers
#   6. notify         → Dashboard callback + Slack
#
# TRIGGER MODES:
#   A) Auto  → push to main → BUILD_PRODUCT=all → smart rebuild (changed only)
#   B) API   → POST from admin dashboard → BUILD_PRODUCT=<id>, BUILD_TYPE=<image|exe>
#              → always builds that exact product/type, ignores change-detection
#   C) Web   → GitLab UI manual run → same defaults as push unless overridden
#
# REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables):
#   CF_R2_ACCESS_KEY_ID       Cloudflare R2 Access Key ID
#   CF_R2_SECRET_ACCESS_KEY   Cloudflare R2 Secret Access Key
#   CF_R2_ACCOUNT_ID          Cloudflare Account ID (found in R2 dashboard)
#   CF_PAGES_API_TOKEN        CF API Token (Pages:Edit + D1:Edit + R2:Edit)
#   CF_ACCOUNT_ID             Cloudflare Account ID
#   AXTO_APP_URL              Dashboard URL (https://axto.io)
#   BUILD_WEBHOOK_SECRET      HMAC secret for dashboard callbacks
#   SLACK_WEBHOOK_URL         (Optional) Slack incoming webhook
#
# REQUIRED RUNNERS:
#   - A Linux runner with Docker-in-Docker support, tagged "docker" (for
#     build-images/push-registry/upload-r2/deploy-cf/notify stages).
#   - A Windows runner with Python 3.11 + PowerShell, tagged "windows" (for
#     build-exe stage). Without this, build-exe jobs simply won't pick up —
#     they'll sit pending. See docs/admin/SETUP_CI_CD.md to register one.
# ═══════════════════════════════════════════════════════════════════════════════

default:
  image: docker:24
  tags:
    - docker

stages:
  - verify
  - build-images
  - push-registry
  - upload-r2
  - build-exe
  - deploy-cf
  - cleanup
  - notify

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      variables:
        PIPELINE_MODE: "auto"
        BUILD_PRODUCT: "all"
        BUILD_TYPE:    "both"
    # ── Nightly scheduled run: full rebuild of latest + redeploy + cleanup ──
    # Create the schedule in GitLab → CI/CD → Schedules (e.g. cron "0 18 * * *" UTC = 01:00 WIB).
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        PIPELINE_MODE: "auto"
        BUILD_PRODUCT: "all"
        BUILD_TYPE:    "both"
        NIGHTLY:       "1"
    - if: '$CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'
      variables:
        PIPELINE_MODE: "manual"
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PIPELINE_MODE: "manual"
    - when: never

variables:
  DOCKER_DRIVER:          overlay2
  DOCKER_TLS_CERTDIR:     ""
  DOCKER_BUILDKIT:        "1"
  BUILD_PRODUCT:          "all"
  BUILD_TYPE:             "both"
  BUILD_ID:               ""
  # Cloudflare R2 — hardcoded bucket endpoint
  R2_BUCKET:              "axto-builds"
  R2_ENDPOINT:            "https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
  REGISTRY:               "${CI_REGISTRY}"
  REGISTRY_IMAGE:         "${CI_REGISTRY_IMAGE}"
  DOCKER_CACHE_REGISTRY:  "${CI_REGISTRY_IMAGE}/cache"

# ── Shared: Docker build template ────────────────────────────────────────────

.build_image_template:
  stage: build-images
  services:
    - docker:24-dind
  variables:
    GIT_DEPTH: 1
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker buildx install || true
  script:
    - |
      FULL_TAG="${REGISTRY_IMAGE}/${IMAGE_NAME}:latest"
      VERSIONED_TAG="${REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_SHA:0:8}"
      CACHE_TAG="${DOCKER_CACHE_REGISTRY}/${IMAGE_NAME}:buildcache"

      docker buildx create --use --name "axto-${IMAGE_NAME}" 2>/dev/null || \
        docker buildx use "axto-${IMAGE_NAME}" 2>/dev/null || true

      docker buildx build \
        --platform linux/amd64 \
        --file "${BUILD_DOCKERFILE}" \
        --context "${BUILD_CONTEXT}" \
        --tag "${FULL_TAG}" \
        --tag "${VERSIONED_TAG}" \
        --cache-from "type=registry,ref=${CACHE_TAG}" \
        --cache-to   "type=registry,ref=${CACHE_TAG},mode=max" \
        --load \
        --label "io.axto.product=${IMAGE_NAME}" \
        --label "io.axto.version=2.1.0" \
        --label "io.axto.commit=${CI_COMMIT_SHA}" \
        --label "io.axto.branch=${CI_COMMIT_BRANCH}" \
        --label "io.axto.build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        .

      echo "✅ Build complete: ${IMAGE_NAME}"
      docker images "${FULL_TAG}"

      mkdir -p /builds/artifacts
      docker save "${FULL_TAG}" | gzip -9 > "/builds/artifacts/${IMAGE_NAME}.tar.gz"
      SIZE=$(du -sh "/builds/artifacts/${IMAGE_NAME}.tar.gz" | cut -f1)
      echo "💾 Saved: ${SIZE} → /builds/artifacts/${IMAGE_NAME}.tar.gz"
  artifacts:
    name: "${IMAGE_NAME}-image"
    paths:
      - /builds/artifacts/${IMAGE_NAME}.tar.gz
    expire_in: 24 hours
    when: on_success

# ── Shared: Registry push template ───────────────────────────────────────────

.push_registry_template:
  stage: push-registry
  services:
    - docker:24-dind
  variables:
    GIT_DEPTH: 1
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - |
      FULL_TAG="${REGISTRY_IMAGE}/${IMAGE_NAME}:latest"
      VERSIONED_TAG="${REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_SHA:0:8}"

      if [ -f "/builds/artifacts/${IMAGE_NAME}.tar.gz" ]; then
        docker load < "/builds/artifacts/${IMAGE_NAME}.tar.gz"
      fi

      docker push "${FULL_TAG}"
      docker push "${VERSIONED_TAG}"
      echo "✅ Pushed: ${IMAGE_NAME} → ${CI_REGISTRY}"

# ── Shared: R2 upload template ────────────────────────────────────────────────
# Always uploads to:
#   builds/latest/raw/<image>.tar.gz   (latest — overwritten)
#   builds/<sha8>/raw/<image>.tar.gz   (versioned — for rollback)

.upload_r2_template:
  stage: upload-r2
  image: python:3.11-alpine
  variables:
    GIT_DEPTH: 1
  before_script:
    - pip install -q "awscli>=1.32"
    - export AWS_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}"
    - export AWS_DEFAULT_REGION="auto"
  script:
    - |
      FILE="/builds/artifacts/${IMAGE_NAME}.tar.gz"

      if [ ! -f "${FILE}" ]; then
        echo "❌ Artifact missing: ${FILE}"
        exit 1
      fi

      SIZE=$(du -sh "${FILE}" | cut -f1)
      SHA8="${CI_COMMIT_SHA:0:8}"
      META="product=${IMAGE_NAME},commit=${SHA8},build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ),build_id=${BUILD_ID:-ci-${CI_PIPELINE_ID}}"

      LATEST_KEY="builds/latest/raw/${IMAGE_NAME}.tar.gz"
      VERSION_KEY="builds/${SHA8}/raw/${IMAGE_NAME}.tar.gz"

      echo "☁️  Uploading ${IMAGE_NAME} (${SIZE}) → R2..."

      aws s3 cp "${FILE}" "s3://${R2_BUCKET}/${VERSION_KEY}" \
        --endpoint-url "${R2_ENDPOINT}" \
        --no-progress \
        --metadata "${META}"

      aws s3 cp "${FILE}" "s3://${R2_BUCKET}/${LATEST_KEY}" \
        --endpoint-url "${R2_ENDPOINT}" \
        --no-progress \
        --metadata "${META}"

      echo "✅ R2 uploaded:"
      echo "   latest    → ${R2_ENDPOINT}/${R2_BUCKET}/${LATEST_KEY}"
      echo "   versioned → ${R2_ENDPOINT}/${R2_BUCKET}/${VERSION_KEY}"
  allow_failure: false

