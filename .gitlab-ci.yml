# ═══ STAGE 4: BUILD WINDOWS EXE ═══
build-exe:guardian-core:
  stage: build-exe
  tags:
    - windows
  variables:
    GIT_DEPTH: 1
  rules:
    - if: '$BUILD_PRODUCT == "guardian-core" && ($BUILD_TYPE == "exe" || $BUILD_TYPE == "both")'
      when: always
    - if: '$BUILD_PRODUCT == "all"'
      changes:
        - engine/**/*
        - .gitlab-ci.yml
      when: always
    - when: never
  before_script:
    - python -m pip install -q --upgrade pip
    - python -m pip install -q pyinstaller pyinstaller-hooks-contrib
    - python -m pip install -q -r engine/requirements.txt
  script:
    - |
      $ErrorActionPreference = "Stop"
      Copy-Item "build-scripts/exe-entrypoints/guardian_core_entry.py" "engine/_build_entry.py" -Force
      Push-Location "engine"
      python -m PyInstaller --onefile --name "guardian-core-windows" --noconfirm --clean `
        --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops.auto `
        --hidden-import=uvicorn.protocols.http.auto --hidden-import=uvicorn.lifespan.on `
        --hidden-import=aiosqlite --hidden-import=yaml --hidden-import=httpx `
        --hidden-import=cryptography --hidden-import=structlog \
        --hidden-import=psutil \
        --hidden-import=numpy \
        --hidden-import=sklearn \
        --hidden-import=pandas \
        --hidden-import=reportlab \
        --hidden-import=aiosmtplib \
        --hidden-import=dnspython `
        --collect-all fastapi --collect-all uvicorn --collect-all starlette --collect-all pydantic `
        "_build_entry.py"
      Remove-Item "_build_entry.py" -Force
      Pop-Location
      New-Item -ItemType Directory -Force -Path "builds_out" | Out-Null
      Move-Item "engine/dist/guardian-core-windows.exe" "builds_out/guardian-core-windows.exe" -Force
      $size = (Get-Item "builds_out/guardian-core-windows.exe").Length / 1MB
      Write-Host ("EXE built: {0:N1} MB" -f $size)

      pip install -q "awscli>=1.32"
      $env:AWS_ACCESS_KEY_ID = $env:CF_R2_ACCESS_KEY_ID
      $env:AWS_SECRET_ACCESS_KEY = $env:CF_R2_SECRET_ACCESS_KEY
      $env:AWS_DEFAULT_REGION = "auto"
      $sha8 = $env:CI_COMMIT_SHA.Substring(0,8)
      $endpoint = "https://$($env:CF_R2_ACCOUNT_ID).r2.cloudflarestorage.com"

      aws s3 cp "builds_out/guardian-core-windows.exe" "s3://axto-builds/builds/latest/exe/guardian-core-windows.exe" --endpoint-url $endpoint --no-progress
      aws s3 cp "builds_out/guardian-core-windows.exe" "s3://axto-builds/builds/$sha8/exe/guardian-core-windows.exe" --endpoint-url $endpoint --no-progress
      Write-Host "Uploaded -> builds/latest/exe/guardian-core-windows.exe"
  artifacts:
    paths:
      - builds_out/guardian-core-windows.exe
    expire_in: 7 days
    when: on_success

