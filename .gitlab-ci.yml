# ═════════════════════════════════════════════════════════════════════════════
# STAGE 5: DEPLOY TO CLOUDFLARE
# ═════════════════════════════════════════════════════════════════════════════

deploy-dashboard:
  stage: deploy-cf
  image: node:20-alpine
  variables:
    GIT_DEPTH: 1
    CLOUDFLARE_API_TOKEN: "${CF_PAGES_API_TOKEN}"
    CLOUDFLARE_ACCOUNT_ID: "${CF_ACCOUNT_ID}"
  before_script:
    - apk add --no-cache git bash curl
  script:
    - |
      echo "🚀 Deploying AXTO Dashboard → Cloudflare Pages..."
      cd dashboard

      npm ci --prefer-offline

      # Apply D1 migrations
      echo "📦 Applying D1 migrations..."
      npx wrangler d1 migrations apply axto-db --remote 2>&1 | tee /tmp/d1.txt || true
      echo "  ✅ $(grep -c 'Applying migration' /tmp/d1.txt 2>/dev/null || echo 0) migrations applied"

      # Build
      npm run pages:build

      # Deploy
      npx wrangler pages deploy .vercel/output/static \
        --project-name=axto-dashboard \
        --branch=main \
        --commit-hash="${CI_COMMIT_SHA}" \
        --commit-message="${CI_COMMIT_MESSAGE}"

      echo "✅ Dashboard deployed → https://axto.io"
  environment:
    name: production
    url: https://axto.io
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      changes:
        - dashboard/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $BUILD_PRODUCT == "dashboard"'
      when: on_success
    - when: never

deploy-workers:
  stage: deploy-cf
  image: node:20-alpine
  variables:
    GIT_DEPTH: 1
    CLOUDFLARE_API_TOKEN: "${CF_PAGES_API_TOKEN}"
    CLOUDFLARE_ACCOUNT_ID: "${CF_ACCOUNT_ID}"
  before_script:
    - apk add --no-cache git bash
    - npm install -g wrangler@latest
  script:
    - |
      echo "⚙️  Deploying Cloudflare Workers..."
      DEPLOYED=0; FAILED=0

      deploy_worker() {
        local dir="$1"; local name="$2"; local cfg="${3:-wrangler.toml}"
        if [ -f "${dir}/${cfg}" ]; then
          echo "  → Deploying ${name}..."
          cd "${dir}"
          wrangler deploy --config "${cfg}" 2>&1 \
            && { echo "  ✅ ${name}"; DEPLOYED=$((DEPLOYED+1)); } \
            || { echo "  ⚠️  ${name} failed (non-fatal)"; FAILED=$((FAILED+1)); }
          cd -
        fi
      }

      deploy_worker "cloudflare"         "Main Worker"
      deploy_worker "cloudflare-workers" "AutoPost Worker"    "wrangler-autopost.toml"
      deploy_worker "cloudflare-workers" "Threat Intel Worker" "wrangler-threat-intel.toml"

      echo ""
      echo "Workers: ${DEPLOYED} deployed, ${FAILED} failed"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      changes:
        - cloudflare/**/*
        - cloudflare-workers/**/*
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main" && $BUILD_PRODUCT == "workers"'
      when: on_success
    - when: never

# ═════════════════════════════════════════════════════════════════════════════
# STAGE 6: NOTIFY
# ═════════════════════════════════════════════════════════════════════════════

notify-dashboard:
  stage: notify
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl
  script:
    - |
      [ -z "${AXTO_APP_URL}" ] && echo "ℹ️  AXTO_APP_URL not set — skip" && exit 0

      STATUS="${CI_JOB_STATUS:-success}"
      SHA8="${CI_COMMIT_SHA:0:8}"

      notify_product() {
        local prod="$1"
        HTTP=$(curl -sf --max-time 15 -w "%{http_code}" -o /dev/null \
          -X POST "${AXTO_APP_URL}/api/admin/engine-builder" \
          -H "Content-Type: application/json" \
          -H "X-Webhook-Secret: ${BUILD_WEBHOOK_SECRET:-}" \
          -d "{
            \"action\":       \"build_callback\",
            \"build_id\":     \"${BUILD_ID:-ci-${CI_PIPELINE_ID}}\",
            \"product\":      \"${prod}\",
            \"type\":         \"image\",
            \"status\":       \"${STATUS}\",
            \"pipeline_url\": \"${CI_PIPELINE_URL}\",
            \"commit\":       \"${SHA8}\",
            \"r2_endpoint\":  \"https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com\",
            \"r2_key\":       \"builds/latest/raw/${prod}.tar.gz\",
            \"gitlab\":       true
          }" 2>/dev/null || echo "000")
        echo "  → ${prod}: HTTP ${HTTP}"
      }

      # NOTE: this always notifies for the full canonical 12-product list when
      # BUILD_PRODUCT=all, regardless of which ones were actually rebuilt this
      # run (smart-rebuild may have skipped most of them) — the dashboard's
      # build_callback handler treats this as "still current as of this
      # commit", which is correct: an unrebuilt product's last successful
      # build IS still its current state.
      case "${BUILD_PRODUCT}" in
        all)
          notify_product "guardian-core"
          notify_product "guardian-node"
          notify_product "guardian-antivirus"
          notify_product "antivirus-core"
          notify_product "vault-core"
          notify_product "edge-core"
          notify_product "soc-core"
          notify_product "compliance-core"
          notify_product "sentinel-core"
          notify_product "studio-core"
          notify_product "orchestra-core"
          notify_product "orchestra-worker-cpu"
          # orchestra-worker-gpu intentionally NOT notified automatically —
          # it is never auto-built, so there is nothing new to report here.
          ;;
        guardian-bundle)
          notify_product "guardian-core"
          notify_product "guardian-node"
          notify_product "guardian-antivirus"
          ;;
        orchestra-bundle)
          notify_product "orchestra-core"
          notify_product "orchestra-worker-cpu"
          notify_product "orchestra-worker-gpu"
          ;;
        *)
          notify_product "${BUILD_PRODUCT}"
          ;;
      esac

      echo "✅ Dashboard notified"
  when: always

notify-slack:
  stage: notify
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl
  script:
    - |
      [ -z "${SLACK_WEBHOOK_URL}" ] && echo "ℹ️  SLACK_WEBHOOK_URL not set" && exit 0

      [ "${CI_JOB_STATUS}" = "success" ] && EMOJI="✅" || EMOJI="❌"
      [ "${CI_JOB_STATUS}" = "success" ] && COLOR="good" || COLOR="danger"

      curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
        -H "Content-Type: application/json" \
        -d "{
          \"attachments\": [{
            \"color\": \"${COLOR}\",
            \"title\": \"${EMOJI} AXTO Build — ${BUILD_PRODUCT}\",
            \"text\": \"Pipeline *${CI_PIPELINE_ID}* completed\\nBranch: \`${CI_COMMIT_BRANCH}\` | Commit: \`${CI_COMMIT_SHA:0:8}\`\",
            \"fields\": [
              {\"title\": \"Product\",  \"value\": \"${BUILD_PRODUCT}\",   \"short\": true},
              {\"title\": \"Status\",   \"value\": \"${CI_JOB_STATUS}\",   \"short\": true},
              {\"title\": \"R2 Bucket\",\"value\": \"axto-builds\",        \"short\": true},
              {\"title\": \"Pipeline\", \"value\": \"<${CI_PIPELINE_URL}|View>\", \"short\": true}
            ],
            \"footer\": \"AXTO GitLab CI\",
            \"ts\": $(date +%s)
          }]
        }" || echo "⚠️  Slack notification failed (non-fatal)"
  when: always
  allow_failure: true

# ═════════════════════════════════════════════════════════════════════════════
# STAGE 0: VERIFY  — quality gate that runs BEFORE any build or deploy.
#   Hard gates (block deploy): logic tests (134 checks) + completeness scan.
#   Soft gate (reports only):  TypeScript typecheck + lint.
# ═════════════════════════════════════════════════════════════════════════════

verify:tests:
  stage: verify
  image: node:20-alpine
  script:
    - echo "🧪 Running deterministic logic suites (no network needed)..."
    - node dashboard/tests/test-lifecycle.mjs
    - node dashboard/tests/test-license-logic.mjs
    - echo "✅ All logic suites passed (lifecycle + license)."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      when: on_success
    - if: '$BUILD_PRODUCT == "dashboard" || $BUILD_PRODUCT == "all"'
      when: on_success
    - when: never

verify:completeness:
  stage: verify
  image: node:20-alpine
  script:
    - echo "🔍 Completeness & freshness scan (target 100%)..."
    - node scripts/ci/scan-completeness.mjs --min 95
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      when: on_success
    - if: '$BUILD_PRODUCT == "dashboard" || $BUILD_PRODUCT == "all"'
      when: on_success
    - when: never

verify:typecheck:
  stage: verify
  image: node:20-alpine
  before_script:
    - apk add --no-cache git
    - cd dashboard && npm ci --prefer-offline --no-audit --no-fund
  script:
    - echo "Typecheck (report-only, does not block deploy)..."
    - npx tsc --noEmit || echo "⚠️  Typecheck reported issues (non-blocking)"
    - npx next lint || echo "⚠️  Lint reported issues (non-blocking)"
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      changes:
        - dashboard/**/*
      when: on_success
    - if: '$BUILD_PRODUCT == "dashboard" || $BUILD_PRODUCT == "all"'
      when: on_success
    - when: never

# ═════════════════════════════════════════════════════════════════════════════
# STAGE 7: CLEANUP — keep "latest" only; prune stale versioned artifacts so old
#                    files never accumulate. Runs mainly on the nightly schedule.
# ═════════════════════════════════════════════════════════════════════════════

cleanup:prune-r2:
  stage: cleanup
  image: amazon/aws-cli:2.15.0
  variables:
    AWS_ACCESS_KEY_ID:     "${CF_R2_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${CF_R2_SECRET_ACCESS_KEY}"
    KEEP_DAYS:             "14"
  script:
    - |
      echo "🧹 Pruning stale R2 build artifacts (keeping builds/latest/** and last ${KEEP_DAYS}d)..."
      ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      CUTOFF=$(date -d "-${KEEP_DAYS} days" +%Y-%m-%d 2>/dev/null || date +%Y-%m-%d)
      # List every object under builds/, skip anything under builds/latest/, delete those older than cutoff.
      aws s3 ls "s3://axto-builds/builds/" --recursive --endpoint-url "$ENDPOINT" 2>/dev/null \
        | while read -r d t sz key; do
            case "$key" in
              builds/latest/*) : ;;  # never delete the live "latest" artifacts
              *) if [ "$d" \< "$CUTOFF" ]; then
                   echo "  - prune $key ($d)";
                   aws s3 rm "s3://axto-builds/$key" --endpoint-url "$ENDPOINT" --only-show-errors || true;
                 fi ;;
            esac
          done
      echo "✅ R2 prune complete — latest artifacts untouched."
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" && $BUILD_PRODUCT == "cleanup"'
      when: manual
    - when: never

cleanup:registry-note:
  stage: cleanup
  image: alpine:3.18
  script:
    - |
      echo "ℹ️  Container image retention is handled by GitLab's native Cleanup Policy."
      echo "    Configure once: Settings → Packages & registries → Clean up image tags:"
      echo "      • Keep the N most recent tags per image (e.g. 5)"
      echo "      • Keep tags matching: ^latest$|^v\\d+"
      echo "      • Remove tags older than 14d"
      echo "    This keeps ':latest' (always overwritten) plus a small rolling history,"
      echo "    so old image tags never accumulate."
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: always
    - when: never

# ═════════════════════════════════════════════════════════════════════════════
# GUIDES: build branded PDF guides for all products and push to Cloudflare R2.
#   Runs on every push to main and on the nightly schedule. Output is served by
#   the dashboard download menu (format=pdf). "latest" is overwritten each run.
# ═════════════════════════════════════════════════════════════════════════════
guides:pdf:
  stage: build-exe
  image: node:22-bookworm
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip awscli >/dev/null
    - pip3 install --quiet --break-system-packages reportlab
  script:
    - echo "📄 Rendering guide markdown for all products (EN + ID)..."
    - node --experimental-strip-types scripts/ci/render-guides.mjs dist/guides
    - echo "📄 Building branded PDFs..."
    - python3 scripts/ci/build-guide-pdfs.py dist/guides dist/guides
    - echo "☁️  Pushing PDFs to Cloudflare R2 (builds/latest/guides/ — overwrites)..."
    - |
      ENDPOINT="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      export AWS_ACCESS_KEY_ID="${CF_R2_ACCESS_KEY_ID}"
      export AWS_SECRET_ACCESS_KEY="${CF_R2_SECRET_ACCESS_KEY}"
      for f in dist/guides/*.pdf; do
        key="builds/latest/guides/$(basename "$f")"
        aws s3 cp "$f" "s3://axto-builds/$key" --endpoint-url "$ENDPOINT" --only-show-errors \
          --content-type application/pdf
        echo "  ✓ $key"
      done
    - echo "✅ Guide PDFs published to R2."
  artifacts:
    paths: [dist/guides/]
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $PIPELINE_MODE == "auto"'
      when: on_success
    - if: '$BUILD_PRODUCT == "dashboard" || $BUILD_PRODUCT == "all"'
      when: on_success
    - when: never
