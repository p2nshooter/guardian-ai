version: "3.9"

# ============================================================
# AXTO SOC — Security Operations Center
# docker compose -f soc-compose.yml up -d
# ============================================================

services:
  soc-core:
    image: axto/soc-core:latest
    container_name: soc-core
    restart: unless-stopped
    ports:
      - "8083:8092"
    volumes:
      - ./soc.yml:/soc/config/soc.yml:ro
      - soc-data:/soc/data
      - soc-logs:/soc/logs
    environment:
      - SOC_CONFIG=/soc/config/soc.yml
      - SOC_PORT=8092
    healthcheck:
      test: ["CMD","curl","-sf","http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - soc-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  soc-data:
  soc-logs:

networks:
  soc-net:
    driver: bridge
