# Cloudflare Pages project "axto-dashboard" (Next.js via @cloudflare/next-on-pages).
name = "axto-dashboard"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# R2 — every record of the platform (users, subscriptions, orders, licences, usage…),
# one JSON document per record (lib/data, docs/R2-DATA-BLUEPRINT.md). Owner, 20 Oct 2026:
# all storage on R2, never D1.
[[r2_buckets]]
binding     = "DATA"
bucket_name = "axto-data"

# R2 — daily backups of DATA (kept 35 days) and the archive of the old D1 tables
[[r2_buckets]]
binding     = "BACKUPS"
bucket_name = "axto-backups"

# D1 — READ ONLY, the source of the one-time move to R2 (lib/data/migrate.ts).
# Nothing writes to it any more; this binding is removed seven days after the move.
[[d1_databases]]
binding        = "DB"
database_name  = "axto-db"
database_id    = "125ec216-76f4-4bdb-ba8d-f29092759183"

# KV — rate limits and small caches
[[kv_namespaces]]
binding = "KV"
id      = "9d8210f3e9234464b60553644c631511"

# R2 — platform content: encrypted prompt library, invoices, archives
[[r2_buckets]]
binding     = "R2"
bucket_name = "axto-storage"

# R2 — member files & saved work (u/<userId>/…)
[[r2_buckets]]
binding     = "USER_FILES"
bucket_name = "axto-documents"

# R2 — self-hosted Docker images, EXEs and guide PDFs
[[r2_buckets]]
binding     = "R2_BUILDS"
bucket_name = "axto-builds"

# Workers AI — used ONLY by the (locked) Managed AI path.
[ai]
binding = "AI"

[vars]
NEXT_PUBLIC_APP_URL = "https://axto.io"

# Secrets (wrangler pages secret put <NAME> --project-name axto-dashboard):
#   JWT_SECRET · ENCRYPTION_KEY · ADMIN_PASSWORD · CRON_SECRET
#   RESEND_API_KEY (optional — else Admin → Payments & Email) · EMAIL_FROM (optional)
#   LICENSE_KEY_HMAC_SECRET (optional) · CONTENT_KEY (prompt library; see docs)
#   license-signing private key (unchanged from v2)
