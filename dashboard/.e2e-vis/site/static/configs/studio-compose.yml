services:

  studio-core:
    image: axto/studio-core:latest
    container_name: axto-studio
    restart: unless-stopped
    command: uvicorn src.api:app --host 0.0.0.0 --port 8080
    ports:
      - "8090:8080"
    volumes:
      - ./studio.yml:/studio/config/studio.yml:ro
      - studio-data:/studio/data
      - studio-logs:/studio/logs
      - studio-artifacts:/studio/artifacts
      - axto-studio-state:/axto-state   # shared by Studio core + modules
    environment:
      - AXTO_STATE_DIR=/axto-state
      - STUDIO_CONFIG=/studio/config/studio.yml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  studio-data:
  studio-logs:
  studio-artifacts:
  axto-studio-state:
    name: axto-studio-state
