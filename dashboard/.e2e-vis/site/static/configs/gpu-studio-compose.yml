# AXTO GPU Studio — Self-Hosted Creative AI Workspace
# Image · Video · Upscale — via your own GPU endpoints
#
# CARA PAKAI:
#   1. Edit gpu-studio.yml → set license_key
#   2. docker compose -f gpu-studio-compose.yml up -d
#   3. Open: http://YOUR_SERVER:8092
# ============================================================

services:
  gpu-studio:
    image: axto/gpu-studio:latest
    container_name: axto-gpu-studio
    restart: unless-stopped
    ports:
      - "8092:8092"
    volumes:
      - ./gpu-studio.yml:/gpu-studio/config/gpu-studio.yml:ro
      - gpu-studio-data:/gpu-studio/data
      - gpu-studio-logs:/gpu-studio/logs
      - axto-studio-state:/axto-state   # shared by Studio core + modules
    environment:
      - AXTO_STATE_DIR=/axto-state
      - GPU_STUDIO_CONFIG=/gpu-studio/config/gpu-studio.yml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  gpu-studio-data:
  gpu-studio-logs:
  axto-studio-state:
    name: axto-studio-state
