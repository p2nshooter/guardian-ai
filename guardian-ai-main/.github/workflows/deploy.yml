# ═══════════════════════════════════════════════════════════════════════════════
# AXTO Platform — CI/CD Pipeline
#
# Trigger: every push to main  (or manual via workflow_dispatch)
# Command: ./push.sh "message"
#
# Two INDEPENDENT pipelines run in parallel:
#
#   A) Docker Images → GHCR  (public registry for self-deploy clients)
#      guardian-engine, orchestra-core, worker-cpu, worker-gpu
#      → Clients pull these images themselves + run with their own docker-compose
#      → Admin can also trigger custom per-client builds via Engine Builder
#
#   B) Cloudflare Deploy
#      D1 migrations (0001–0015) + 48 PDFs → R2 + Next.js build + Pages deploy + Workers
#
# CLIENT MODEL:
#   Client beli paket → dapat file registry produk → build sendiri di infra mereka sendiri
#   Engine Builder = tool INTERNAL admin, bukan untuk client
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy AXTO Platform

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker:
        description: "Skip Docker builds (use existing GHCR images)"
        type: boolean
        default: false
      skip_pdfs:
        description: "Skip PDF upload (already in R2)"
        type: boolean
        default: false
      skip_deploy:
        description: "Skip Cloudflare deploy"
        type: boolean
        default: false

# ═══════════════════════════════════════════════════════════════════════════════
# JOB A — Build & Push all 4 Docker images → GHCR
# Runs independently from Cloudflare deploy
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build-docker:
    name: "🐳 ${{ matrix.image }} → GHCR"
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_docker }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false   # All 4 images build independently — one failure won't cancel others
      matrix:
        include:
          - image: guardian-engine
            context: ./engine
            file: ./engine/Dockerfile
          - image: orchestra-core
            context: ./orchestra
            file: ./orchestra/Dockerfile
          - image: orchestra-worker-cpu
            context: ./orchestra
            file: ./orchestra/Dockerfile.worker-cpu
          - image: orchestra-worker-gpu
            context: ./orchestra
            file: ./orchestra/Dockerfile.worker-gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=AXTO ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🐳 ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════════
# JOB B — Deploy to Cloudflare (D1 + R2 + Pages + Workers)
# Runs INDEPENDENTLY from Docker builds — not blocked by Docker failures
# ═══════════════════════════════════════════════════════════════════════════════
  deploy-cloudflare:
    name: "☁️ Cloudflare Deploy"
    runs-on: ubuntu-latest
    # INDEPENDENT from Docker — runs on any push to main, regardless of Docker result
    if: |
      !inputs.skip_deploy &&
      github.event_name != 'pull_request'
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      # ── D1 Migrations ──────────────────────────────────────────────────
      - name: "🗄️ D1 Migrations"
        working-directory: dashboard
        run: |
          echo "Running D1 migrations..."
          npx wrangler d1 migrations apply axto-db --remote
          echo "✅ Migrations applied"

      # ── R2 PDF Upload (48 playbooks) ────────────────────────────────────
      - name: "📦 PDFs → R2"
        if: ${{ !inputs.skip_pdfs }}
        working-directory: dashboard
        run: |
          PDF_DIR="../playbooks-pdf"
          BUCKET="axto-storage"
          UPLOADED=0
          FAILED=0

          if [ ! -d "$PDF_DIR" ] || [ -z "$(ls -A "$PDF_DIR"/*.pdf 2>/dev/null)" ]; then
            echo "⚠️  No PDFs found in $PDF_DIR — skipping"
            exit 0
          fi

          TOTAL=$(ls "$PDF_DIR"/*.pdf | wc -l)
          echo "📦 Uploading $TOTAL PDFs to R2 bucket: $BUCKET"

          for pdf in "$PDF_DIR"/*.pdf; do
            [ -f "$pdf" ] || continue
            slug="$(basename "${pdf%.pdf}")"
            key="playbooks/${slug}.pdf"
            echo "  ⬆ $slug"
            if npx wrangler r2 object put "${BUCKET}/${key}" \
              --file="$pdf" \
              --content-type="application/pdf"; then
              UPLOADED=$((UPLOADED+1))
            else
              echo "  ⚠️  Failed: $slug"
              FAILED=$((FAILED+1))
            fi
          done

          echo ""
          echo "✅ R2: $UPLOADED/$TOTAL uploaded, $FAILED failed"
          echo "### 📦 R2: $UPLOADED PDFs uploaded" >> $GITHUB_STEP_SUMMARY
          [ $FAILED -eq 0 ] || echo "### ⚠️ $FAILED PDFs failed to upload" >> $GITHUB_STEP_SUMMARY

      # ── Sync R2 keys + file sizes → D1 ─────────────────────────────────
      - name: "🔗 Sync PDF metadata → D1"
        if: ${{ !inputs.skip_pdfs }}
        working-directory: dashboard
        run: |
          PDF_DIR="../playbooks-pdf"
          COUNT=0
          [ -d "$PDF_DIR" ] || exit 0

          for pdf in "$PDF_DIR"/*.pdf; do
            [ -f "$pdf" ] || continue
            slug="$(basename "${pdf%.pdf}")"
            key="playbooks/${slug}.pdf"
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf" 2>/dev/null || echo "0")

            npx wrangler d1 execute axto-db --remote \
              --command="UPDATE playbooks SET r2_key='${key}', file_size_bytes=${size}, file_format='pdf', updated_at=datetime('now') WHERE slug='${slug}';" \
              2>/dev/null || true
            COUNT=$((COUNT+1))
          done
          echo "✅ D1 metadata synced for $COUNT playbooks"

      # ── Sync Secrets → CF Pages ─────────────────────────────────────────
      - name: "🔐 Sync Secrets → CF Pages"
        working-directory: dashboard
        run: |
          sync_secret() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              echo "$val" | npx wrangler pages secret put "$name" \
                --project-name=axto-dashboard 2>/dev/null \
                && echo "  ✅ $name" \
                || echo "  ⚠️  $name skipped"
            else
              echo "  ⚠️  $name not set in GitHub Secrets"
            fi
          }
          sync_secret JWT_SECRET         "${{ secrets.JWT_SECRET }}"
          sync_secret ENCRYPTION_KEY     "${{ secrets.ENCRYPTION_KEY }}"
          sync_secret ADMIN_PASSWORD     "${{ secrets.ADMIN_PASSWORD }}"
          sync_secret RESEND_API_KEY     "${{ secrets.RESEND_API_KEY }}"
          sync_secret CRON_SECRET        "${{ secrets.CRON_SECRET }}"
          sync_secret GHCR_OWNER        "${{ github.repository_owner }}"

      # ── Build Next.js → Cloudflare Pages ────────────────────────────────
      - name: "🔨 Build Dashboard"
        working-directory: dashboard
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
          NEXT_PUBLIC_GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          npx @cloudflare/next-on-pages
          echo "✅ Dashboard built"

      # ── Deploy → Cloudflare Pages ───────────────────────────────────────
      - name: "🚀 Deploy → Cloudflare Pages"
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: axto-dashboard
          directory: dashboard/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # ── Deploy Cloudflare Workers ────────────────────────────────────────
      - name: "⚡ Deploy CF Workers"
        working-directory: cloudflare-workers
        run: |
          if [ -f "wrangler-autopost.toml" ]; then
            npx wrangler deploy --config wrangler-autopost.toml \
              && echo "  ✅ autopost-cron deployed" \
              || echo "  ⚠️  autopost-cron failed (non-fatal)"
            [ -n "${{ secrets.CRON_SECRET }}" ] && \
              echo "${{ secrets.CRON_SECRET }}" | \
              npx wrangler secret put CRON_SECRET \
                --config wrangler-autopost.toml 2>/dev/null || true
          fi
          if [ -f "wrangler-threat-intel.toml" ]; then
            npx wrangler deploy --config wrangler-threat-intel.toml \
              && echo "  ✅ threat-intel-sync deployed" \
              || echo "  ⚠️  threat-intel-sync failed (non-fatal)"
          fi

      # ── Final Summary ────────────────────────────────────────────────────
      - name: "📋 Deploy Summary"
        if: always()
        run: |
          PDF_COUNT=$(ls playbooks-pdf/*.pdf 2>/dev/null | wc -l || echo "0")
          APP_URL="${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}"
          OWNER="${{ github.repository_owner }}"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              ✅  AXTO Platform Deploy Complete              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  CLOUDFLARE                                                 ║"
          echo "║  🗄️  D1 migrations 0001–0014 applied                        ║"
          echo "║  📦  Playbook PDFs: ${PDF_COUNT} files → R2 (axto-storage)    ║"
          echo "║  🔐  Secrets synced to CF Pages                             ║"
          echo "║  🌐  Dashboard: ${APP_URL}                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  DOCKER IMAGES (built separately in parallel)               ║"
          echo "║  🛡️  guardian-engine  (core + node + ClamAV antivirus)      ║"
          echo "║  ⚡  orchestra-core   (Orchestra API server)                ║"
          echo "║  ⚡  orchestra-worker-cpu  (cloud AI worker)                ║"
          echo "║  ⚡  orchestra-worker-gpu  (local GPU worker)               ║"
          echo "║  → ghcr.io/${OWNER}/                        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "### ✅ AXTO Platform — Cloudflare Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| D1 Migrations (0001–0014) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| R2 Playbook PDFs (${PDF_COUNT} files) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets → CF Pages | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare Pages Dashboard | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare Workers | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live:** ${APP_URL}" >> $GITHUB_STEP_SUMMARY
          echo "📦 **GHCR:** \`ghcr.io/${OWNER}/\`" >> $GITHUB_STEP_SUMMARY
