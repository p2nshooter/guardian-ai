# ============================================================
# AXTO — Cloudflare Worker: Guardian Threat Feed Proxy
# ============================================================
name = "axto-guardian-threat-proxy"
main = "threat-feed-proxy.js"
compatibility_date = "2024-11-01"

[vars]
DASHBOARD_URL = "https://axto.io"

# ── KV Namespace (License cache) ────────────────────────────
# ID diisi otomatis oleh setup.sh dan deploy.yml
[[kv_namespaces]]
binding    = "LICENSE_KV"
id         = "PLACEHOLDER_WILL_BE_SET_BY_SETUP"
preview_id = "PLACEHOLDER_WILL_BE_SET_BY_SETUP"

[[r2_buckets]]
binding     = "THREAT_FEED_BUCKET"
bucket_name = "guardian-threat-feed"

# ── Secrets ─────────────────────────────────────────────────
# Secrets: wrangler secret put CF_LICENSE_SECRET --env production
