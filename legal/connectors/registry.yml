# This file defines ALL legal data source connectors. No URLs are hardcoded
# in application code — this YAML is the single source of truth for all
# data endpoints. Follow Bagian 12 of the architecture spec for adding new
# sources. Format per Bagian 12.1 (Source Record Schema).
