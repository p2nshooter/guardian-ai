# ============================================================
# AXTO Sentinel — IoT/OT Security Platform | Configuration
#
# HOW TO USE:
#   1. Get license: https://axto.io/portal (keys start with SNTL-)
#   2. docker compose -f sentinel-compose.yml up -d
#   3. Dashboard: http://YOUR_SERVER:8087
# ============================================================
sentinel:
  license_key: "SNTL-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
  license_validate_url: "https://axto.io/api/license-validate"
  host: "0.0.0.0"
  port: 8087
  data_dir: /sentinel/data
  # Networks to scan (CIDR notation)
  scan_networks:
    - "192.168.1.0/24"
    # - "10.0.0.0/24"
    # - "172.16.0.0/24"
  scan_interval_hours: 4
  device_timeout_sec: 5
  alerting:
    # slack_webhook: "https://hooks.slack.com/..."
    # alert_email_to: "security@example.com"
