# AXTO Hybrid Studio — Pipeline Automation: AI + GPU + Voice + Sound
# Port: 8093  |  Docs: axto.io/guide/hybrid-studio
services:
  hybrid-studio:
    image: axto/hybrid-studio:latest
    container_name: axto-hybrid-studio
    restart: unless-stopped
    ports:
      - "8093:8093"
    volumes:
      - ./hybrid-studio.yml:/hybrid-studio/config/hybrid-studio.yml:ro
      - hybrid-studio-data:/hybrid-studio/data
      - hybrid-studio-logs:/hybrid-studio/logs
      - axto-studio-state:/axto-state   # shared by Studio core + modules
    environment:
      - AXTO_STATE_DIR=/axto-state
      - HYBRID_STUDIO_CONFIG=/hybrid-studio/config/hybrid-studio.yml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  hybrid-studio-data:
  hybrid-studio-logs:
  axto-studio-state:
    name: axto-studio-state
