# Preview deploy → https://axto-preview.pages.dev
# A SEPARATE Cloudflare Pages project with its own D1 / KV / R2
# (dashboard/deploy/preview.wrangler.toml). It never touches the production
# project "axto-dashboard", its database "axto-db" or its buckets.
# Runs on every push to a claude/** development branch that changes the site.
# ==============================================================================
name: Deploy Preview

on:
  push:
    branches: ['claude/**']
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:

concurrency:
  group: deploy-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build & deploy preview
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488
      PROJECT: axto-preview
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci --prefer-offline
      - name: Checks (types + unit tests)
        run: npx tsc --noEmit -p . && npm test
      - name: Use the isolated preview configuration
        run: cp deploy/preview.wrangler.toml wrangler.toml
      - name: Apply migrations to the PREVIEW database
        run: npx wrangler d1 migrations apply axto-preview-db --remote
      - name: Build
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_APP_URL: https://axto-preview.pages.dev
          NEXT_PUBLIC_PREVIEW: "1"
          NODE_ENV: production
      - name: Project and preview-only secrets (created once, never production's)
        run: |
          npx wrangler pages project create "$PROJECT" --production-branch preview 2>/dev/null || true
          existing="$(npx wrangler pages secret list --project-name "$PROJECT" 2>/dev/null || true)"
          for name in JWT_SECRET ENCRYPTION_KEY SETTINGS_ENCRYPTION_KEY CRON_SECRET DOWNLOAD_SIGNING_SECRET; do
            if ! grep -q "$name" <<<"$existing"; then
              openssl rand -hex 32 | npx wrangler pages secret put "$name" --project-name "$PROJECT"
            fi
          done
      - name: Deploy
        run: npx wrangler pages deploy .vercel/output/static --project-name "$PROJECT" --branch preview --commit-dirty=true
      - name: Smoke test the preview
        run: |
          sleep 20
          for path in / /pricing /apps /contact /api/health /api/support; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://axto-preview.pages.dev$path")
            echo "$path → $code"
          done
          curl -s https://axto-preview.pages.dev/api/health
