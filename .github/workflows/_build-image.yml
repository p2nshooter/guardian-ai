# Reusable workflow: Build Docker image → upload to CF R2
# Called by auto-build-all.yml for each product
# ═══════════════════════════════════════════════════════════════

name: Build & Upload Image

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: axto/${{ inputs.image_name }}:latest
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Save & upload to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          # Account ID & bucket are NOT secret — hardcoded so a mistyped secret
          # can never break the R2 endpoint/bucket. Only the R2 keys are secrets.
          CF_ACCOUNT_ID:         ec77c7422c83e094aa03df0b3f94e488
          R2_BUCKET:             axto-builds
        run: |
          echo "💾 Saving ${{ inputs.image_name }}..."
          docker save axto/${{ inputs.image_name }}:latest | gzip -9 > ${{ inputs.image_name }}.tar.gz
          SIZE=$(du -sh ${{ inputs.image_name }}.tar.gz | cut -f1)
          echo "✅ ${{ inputs.image_name }}.tar.gz — ${SIZE}"
          bash scripts/ci/r2-put.sh ${{ inputs.image_name }}.tar.gz \
            "${R2_BUCKET}/builds/latest/raw/${{ inputs.image_name }}.tar.gz" application/gzip

