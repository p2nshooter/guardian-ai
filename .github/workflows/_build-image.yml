# Reusable workflow: Build Docker image → upload to CF R2
# Called by auto-build-all.yml for each product
# ═══════════════════════════════════════════════════════════════

name: Build & Upload Image

on:
  workflow_call:
    inputs:
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          tags: axto/${{ inputs.image_name }}:latest
          cache-from: type=gha,scope=${{ inputs.image_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}

      - name: Save & upload to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          # Account ID & bucket are NOT secret — hardcoded so a mistyped secret
          # can never break the R2 endpoint/bucket. Only the R2 keys are secrets.
          CF_ACCOUNT_ID:         ec77c7422c83e094aa03df0b3f94e488
          R2_BUCKET:             axto-builds
        run: |
          echo "💾 Saving ${{ inputs.image_name }}..."
          docker save axto/${{ inputs.image_name }}:latest | gzip -9 > ${{ inputs.image_name }}.tar.gz
          SIZE=$(du -sh ${{ inputs.image_name }}.tar.gz | cut -f1)
          echo "✅ ${{ inputs.image_name }}.tar.gz — ${SIZE}"
          pip install -q "awscli>=1.32"
          aws s3 cp ${{ inputs.image_name }}.tar.gz \
            "s3://${R2_BUCKET}/builds/latest/raw/${{ inputs.image_name }}.tar.gz" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "☁️ → R2 builds/latest/raw/${{ inputs.image_name }}.tar.gz"

      - name: Notify dashboard
        if: always()
        env:
          AXTO_APP_URL: ${{ secrets.AXTO_APP_URL }}
          BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
        run: |
          if [ -n "$AXTO_APP_URL" ]; then
            STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
            curl -sf -X POST "${AXTO_APP_URL}/api/admin/engine-builder" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${BUILD_WEBHOOK_SECRET}" \
              -d "{\"action\":\"build_callback\",\"product\":\"${{ inputs.image_name }}\",\"type\":\"image\",\"status\":\"${STATUS}\",\"commit\":\"${{ github.sha }}\"}" \
              || true
          fi
