# AXTO — One-click Cloudflare provisioning (KV + R2 + Pages)
#
# Creates every Cloudflare resource the platform needs, IDEMPOTENTLY:
#   • KV namespace : axto-kv
#   • R2 buckets   : axto-data (every record), axto-backups, axto-storage, axto-builds, axto-documents
#   • Pages project: axto-dashboard
# Then patches the real KV id back into dashboard/wrangler.toml and commits it.
# Records are stored in R2 only — this never creates a D1 database (CLAUDE.md §6).
#
# Run it ONCE (Actions → "Provision Cloudflare" → Run workflow). Safe to re-run.
#
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   (token needs: Workers KV Edit, Workers R2 Edit, Pages Edit)
# ═══════════════════════════════════════════════════════════════════════════════
name: Provision Cloudflare

on:
  workflow_dispatch:
    inputs:
      commit_ids:
        description: "Commit discovered resource IDs back into wrangler.toml"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: provision-cloudflare
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  KV_TITLE: axto-kv
  R2_PRIMARY: axto-storage
  R2_BUILDS: axto-builds
  R2_BUCKETS: axto-data axto-backups axto-storage axto-builds axto-documents
  PAGES_PROJECT: axto-dashboard

jobs:
  provision:
    name: "☁️ Provision Cloudflare resources"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Preflight — verify secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in repo secrets."
            exit 1
          fi
          npm i -g wrangler@3 >/dev/null 2>&1
          echo "wrangler $(wrangler --version)"

      # Robustly extract JSON from wrangler output (it may print an info notice
      # like "📎 It looks like you are authenticating..." before the JSON).
      # parse_json <name-field> <id-field>  — reads stdin, prints matching id.

      # ── KV ────────────────────────────────────────────────────────────────
      - name: Create / resolve KV namespace
        id: kv
        continue-on-error: true
        env:
          KV_ID_SECRET: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          wrangler kv namespace create "$KV_TITLE" 2>/dev/null || echo "KV '$KV_TITLE' exists or create skipped."
          ID="$(wrangler kv namespace list 2>/dev/null | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const i=s.search(/[\[{]/);try{const a=JSON.parse(s.slice(i));const x=(Array.isArray(a)?a:[]).find(n=>n.title===process.env.KV_TITLE||(n.title||"").endsWith("_"+process.env.KV_TITLE));console.log(x?x.id:"")}catch(e){console.log("")}})')"
          [ -z "$ID" ] && ID="$KV_ID_SECRET"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "🔑 KV $KV_TITLE → ${ID:-NOT FOUND}"

      # ── R2 ────────────────────────────────────────────────────────────────
      - name: Create R2 buckets
        continue-on-error: true
        run: |
          for b in $R2_BUCKETS; do
            wrangler r2 bucket create "$b" 2>/dev/null && echo "🪣 created $b" || echo "🪣 $b exists or create skipped"
          done

      # ── Pages project ─────────────────────────────────────────────────────
      - name: Create Pages project
        continue-on-error: true
        run: |
          wrangler pages project create "$PAGES_PROJECT" --production-branch main 2>/dev/null \
            && echo "📄 created Pages project $PAGES_PROJECT" \
            || echo "📄 Pages project $PAGES_PROJECT exists or create skipped"

      # ── Patch wrangler.toml with the resolved IDs ─────────────────────────
      - name: Patch dashboard/wrangler.toml
        if: ${{ inputs.commit_ids }}
        env:
          KV_ID: ${{ steps.kv.outputs.id }}
        run: |
          f=dashboard/wrangler.toml
          if [ -n "$KV_ID" ]; then
            # replace the id on the line that follows the KV binding
            awk -v id="$KV_ID" '
              /binding[[:space:]]*=[[:space:]]*"KV"/ {print; inkv=1; next}
              inkv && /^id[[:space:]]*=/ {print "id      = \"" id "\""; inkv=0; next}
              {print}
            ' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          fi
          echo "── wrangler.toml after patch ──"; grep -nE 'database_id|binding|^id' "$f" || true

      - name: Commit ID changes
        if: ${{ inputs.commit_ids }}
        run: |
          if git diff --quiet -- dashboard/wrangler.toml; then
            echo "No wrangler.toml changes to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dashboard/wrangler.toml
            git commit -m "chore(cf): sync provisioned Cloudflare resource IDs into wrangler.toml"
            git push
            echo "✅ Committed resolved Cloudflare IDs."
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## ☁️ Cloudflare provisioning complete"
            echo ""
            echo "| Resource | Name | ID |"
            echo "|---|---|---|"
            echo "| KV namespace | \`$KV_TITLE\` | \`${{ steps.kv.outputs.id }}\` |"
            for b in $R2_BUCKETS; do echo "| R2 bucket | \`$b\` | — |"; done
            echo "| Pages project | \`$PAGES_PROJECT\` | — |"
            echo ""
            echo "Resource IDs were patched into \`dashboard/wrangler.toml\` and committed (if enabled)."
            echo "Push to \`main\` now auto-builds images/EXEs and deploys the dashboard."
          } >> "$GITHUB_STEP_SUMMARY"
