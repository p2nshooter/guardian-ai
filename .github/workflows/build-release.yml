            src\api.py

      - name: Build guardian-node.exe
        if: steps.v.outputs.need_guardian_node == 'true'
        shell: cmd
        run: |
          cd engine
          pyinstaller --onefile --name guardian-node ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-gnode --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --hidden-import asyncpg --hidden-import aiosqlite ^
            --collect-all structlog --collect-all pydantic ^
            src\__main__.py

      - name: Build orchestra-core.exe
        if: steps.v.outputs.need_orchestra_core == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-core ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-ocore --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --collect-all structlog --collect-all pydantic ^
            orchestra_core\main.py

      - name: Build orchestra-worker-cpu.exe
        if: steps.v.outputs.need_worker_cpu == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-worker-cpu ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-wcpu --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --collect-all structlog ^
            orchestra_worker\worker_cpu.py

      - name: Build orchestra-worker-gpu.exe
        if: steps.v.outputs.need_worker_gpu == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-worker-gpu ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-wgpu --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --collect-all structlog ^
            orchestra_worker\worker_gpu.py

      - name: Generate config + install.bat
        shell: bash
        run: |
          D="${{ steps.v.outputs.dist }}"
          LIC="${{ inputs.license_key }}" LT="${{ inputs.license_type }}"
          MN="${{ inputs.max_nodes }}" MG="${{ inputs.max_gpu }}" MW="${{ inputs.max_workers }}"
          CLIENT="${{ inputs.client_name }}" BID="${{ inputs.build_id }}"
          PROD="${{ inputs.product }}"

          if [[ "$PROD" == *guardian* || "$PROD" == "full-bundle" ]]; then
            cat > "${D}/guardian.yml" << YAML
guardian:
  license_key: "${LIC}"
  license_validate_url: "https://axto.io/api/license-validate"
  max_nodes: ${MN}
  scan_mode: "auto"
  ai_pool:
    providers:
      - provider: openai
        api_key: "sk-REPLACE_WITH_YOUR_KEY"
        model: "gpt-4o-mini"
YAML
          fi

          if [[ "$PROD" == *orchestra* || "$PROD" == "full-bundle" ]]; then
            cat > "${D}/orchestra.yml" << YAML
orchestra:
