# ═══════════════════════════════════════════════════════════════════════════════
# AXTO Engine Builder — Per-Client Build Pipeline
#
# Flow:
#   Docker → build image lokal → docker save → gzip → zip → upload CF R2
#   EXE    → PyInstaller compile binary → zip → upload CF R2
#
# License TIDAK di-embed ke binary.
# Client wajib input license key saat pertama run → validasi ke axto.io
#
# Artifacts disimpan di CF R2 axto-artifacts/builds/<build_id>/
# Tidak ada push ke GHCR.
# ═══════════════════════════════════════════════════════════════════════════════

name: Build Client Release

on:
  workflow_dispatch:
    inputs:
      build_id:        { description: "Engine build ID",                         required: true  }
      product:         { description: "guardian-core|guardian-bundle|orchestra-bundle|full-bundle|...", required: true, default: "guardian-bundle" }
      build_type:      { description: "docker | exe",                             required: true, default: "docker" }
      arch:            { description: "linux/amd64 | linux/arm64 | windows/amd64", required: false, default: "linux/amd64" }
      client_name:     { description: "Client name",                              required: false, default: "" }
      client_email:    { description: "Client email",                             required: false, default: "" }
      license_type:    { description: "trial | monthly | yearly | lifetime",      required: true, default: "yearly" }
      trial_days:      { description: "Trial days 1-7 (only for trial type)",     required: false, default: "0" }
      max_nodes:       { description: "Max CPU nodes",                            required: false, default: "1" }
      max_gpu:         { description: "Max GPU count",                            required: false, default: "0" }
      max_workers:     { description: "Max workers",                              required: false, default: "10" }
      unlimited:       { description: "Unlimited: 1|0",                          required: false, default: "0" }
      r2_upload_key:   { description: "CF R2 destination key",                   required: false, default: "" }
      callback_url:    { description: "Webhook URL to notify dashboard",          required: false, default: "" }
      callback_secret: { description: "Webhook secret",                          required: false, default: "" }

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — DOCKER BUILD (linux/amd64 or linux/arm64)
# Builds Docker image LOCALLY, saves as .tar.gz, zips with config, uploads R2
# No GHCR push. No registry. Pure local build → R2.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-docker:
    name: "🐳 Docker [${{ inputs.product }}]"
    runs-on: ubuntu-latest
    if: inputs.build_type == 'docker'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Set build metadata
        id: meta
        run: |
          TAG="client-$(echo '${{ inputs.build_id }}' | cut -c1-8)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          PROD="${{ inputs.product }}"
          BUILD_GUARDIAN_CORE=false; BUILD_GUARDIAN_NODE=false; BUILD_CLAMAV=false
          BUILD_ORCHESTRA_CORE=false; BUILD_WORKER_CPU=false; BUILD_WORKER_GPU=false
          case "$PROD" in
            guardian-core)        BUILD_GUARDIAN_CORE=true ;;
            guardian-node)        BUILD_GUARDIAN_NODE=true ;;
            guardian-clamav)      BUILD_CLAMAV=true ;;
            guardian-core-node)   BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true ;;
            guardian-bundle)      BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true; BUILD_CLAMAV=true ;;
            orchestra-core)       BUILD_ORCHESTRA_CORE=true ;;
            orchestra-worker-cpu) BUILD_WORKER_CPU=true ;;
            orchestra-worker-gpu) BUILD_WORKER_GPU=true ;;
            orchestra-core-cpu)   BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true ;;
            orchestra-bundle)     BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true; BUILD_WORKER_GPU=true ;;
            full-bundle)          BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true; BUILD_CLAMAV=true
                                  BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true; BUILD_WORKER_GPU=true ;;
          esac
          echo "build_guardian_core=${BUILD_GUARDIAN_CORE}" >> $GITHUB_OUTPUT
          echo "build_guardian_node=${BUILD_GUARDIAN_NODE}" >> $GITHUB_OUTPUT
          echo "build_clamav=${BUILD_CLAMAV}"               >> $GITHUB_OUTPUT
          echo "build_orchestra_core=${BUILD_ORCHESTRA_CORE}" >> $GITHUB_OUTPUT
          echo "build_worker_cpu=${BUILD_WORKER_CPU}"        >> $GITHUB_OUTPUT
          echo "build_worker_gpu=${BUILD_WORKER_GPU}"        >> $GITHUB_OUTPUT
          PLATFORMS="${{ inputs.arch }}"
          [[ "$PLATFORMS" == "windows/amd64" ]] && PLATFORMS="linux/amd64"
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT

      # ── Build images locally (no license embed, no GHCR push) ─────────────
      - name: 🛡️ Build guardian-core
        if: steps.meta.outputs.build_guardian_core == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: axto/guardian-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=guardian-core
          cache-to:   type=gha,mode=max,scope=guardian-core

      - name: 🤖 Build guardian-node
        if: steps.meta.outputs.build_guardian_node == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile.node
          push: false
          load: true
          platforms: linux/amd64
          tags: axto/guardian-node:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=guardian-node
          cache-to:   type=gha,mode=max,scope=guardian-node

      - name: 🦠 Pull & tag ClamAV
        if: steps.meta.outputs.build_clamav == 'true'
        run: |
          docker pull clamav/clamav:stable_base
          docker tag clamav/clamav:stable_base axto/guardian-clamav:${{ steps.meta.outputs.tag }}
          echo "✅ ClamAV tagged locally"

      - name: ⚡ Build orchestra-core
        if: steps.meta.outputs.build_orchestra_core == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: axto/orchestra-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-core
          cache-to:   type=gha,mode=max,scope=orchestra-core

      - name: 💻 Build orchestra-worker-cpu
        if: steps.meta.outputs.build_worker_cpu == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile.worker-cpu
          push: false
          load: true
          platforms: linux/amd64
          tags: axto/orchestra-worker-cpu:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-worker-cpu
          cache-to:   type=gha,mode=max,scope=orchestra-worker-cpu

      - name: 🎮 Build orchestra-worker-gpu
        if: steps.meta.outputs.build_worker_gpu == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile.worker-gpu
          push: false
          load: true
          platforms: linux/amd64
          tags: axto/orchestra-worker-gpu:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-worker-gpu
          cache-to:   type=gha,mode=max,scope=orchestra-worker-gpu

      - name: 💾 Export images as tarballs
        run: |
          DIST="dist/${{ inputs.build_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PROD="${{ inputs.product }}"
          mkdir -p "${DIST}"

          save() {
            local img=$1 name=$2
            echo "💾 Saving ${img}..."
            docker save "${img}" | gzip > "${DIST}/${name}.tar.gz"
            echo "  → $(ls -lh ${DIST}/${name}.tar.gz | awk '{print $5}')"
          }

          case "$PROD" in
            guardian-core)    save axto/guardian-core:${TAG} guardian-core ;;
            guardian-node)    save axto/guardian-node:${TAG} guardian-node ;;
            guardian-clamav)  save axto/guardian-clamav:${TAG} guardian-clamav ;;
            guardian-core-node)
              save axto/guardian-core:${TAG}   guardian-core
              save axto/guardian-node:${TAG}   guardian-node ;;
            guardian-bundle)
              save axto/guardian-core:${TAG}   guardian-core
              save axto/guardian-node:${TAG}   guardian-node
              save axto/guardian-clamav:${TAG} guardian-clamav ;;
            orchestra-core)       save axto/orchestra-core:${TAG} orchestra-core ;;
            orchestra-worker-cpu) save axto/orchestra-worker-cpu:${TAG} orchestra-worker-cpu ;;
            orchestra-worker-gpu) save axto/orchestra-worker-gpu:${TAG} orchestra-worker-gpu ;;
            orchestra-core-cpu)
              save axto/orchestra-core:${TAG}       orchestra-core
              save axto/orchestra-worker-cpu:${TAG} orchestra-worker-cpu ;;
            orchestra-bundle)
              save axto/orchestra-core:${TAG}       orchestra-core
              save axto/orchestra-worker-cpu:${TAG} orchestra-worker-cpu
              save axto/orchestra-worker-gpu:${TAG} orchestra-worker-gpu ;;
            full-bundle)
              save axto/guardian-core:${TAG}        guardian-core
              save axto/guardian-node:${TAG}        guardian-node
              save axto/guardian-clamav:${TAG}      guardian-clamav
              save axto/orchestra-core:${TAG}       orchestra-core
              save axto/orchestra-worker-cpu:${TAG} orchestra-worker-cpu
              save axto/orchestra-worker-gpu:${TAG} orchestra-worker-gpu ;;
          esac

          ls -lh "${DIST}/"

      - name: 📄 Generate config + compose files
        run: |
          DIST="dist/${{ inputs.build_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PROD="${{ inputs.product }}"
          CLIENT="${{ inputs.client_name }}"
          BID="${{ inputs.build_id }}"
          MN="${{ inputs.max_nodes }}"
          MG="${{ inputs.max_gpu }}"
          MW="${{ inputs.max_workers }}"
          LT="${{ inputs.license_type }}"

          # ── guardian.yml (semua produk Guardian) ──────────────────────────
          case "$PROD" in
            guardian-core|guardian-node|guardian-clamav|guardian-bundle|full-bundle)
              cat > "${DIST}/guardian.yml" << CONFIGYML
# AXTO Guardian AI — Configuration
# Build: ${TAG} | Client: ${CLIENT}
# ⚠️  Isi license_key dengan license yang diterima dari AXTO (WAJIB sebelum start)
guardian:
  license_key: "MASUKKAN_LICENSE_KEY_DISINI"
  license_validate_url: "https://axto.io/api/license-validate"
  max_nodes: ${MN}
  scan_mode: "auto"
  scan_interval: 300
  scan_paths: [/host, /tmp, /var/www]
  ai_pool:
    routing: cost
    fallback: true
    providers:
      - provider: openai
        api_key: "sk-REPLACE_YOUR_OPENAI_KEY"
        model: "gpt-4o-mini"
      # - provider: groq
      #   api_key: "gsk_REPLACE_ME"
      # - provider: ollama
      #   base_url: "http://localhost:11434"
      #   model: "llama3"
  alerts: { email: "", slack_webhook: "", discord_webhook: "" }
  log_retention_days: 90
CONFIGYML
            ;;
          esac

          # ── orchestra.yml (semua produk Orchestra) ────────────────────────
          case "$PROD" in
            orchestra-core|orchestra-worker-cpu|orchestra-worker-gpu|orchestra-bundle|full-bundle)
              cat > "${DIST}/orchestra.yml" << CONFIGYML
# AXTO Orchestra AI — Configuration
# Build: ${TAG} | Client: ${CLIENT}
# ⚠️  Isi license_key dengan license yang diterima dari AXTO (WAJIB sebelum start)
orchestra:
  license_key: "MASUKKAN_LICENSE_KEY_DISINI"
  license_validate_url: "https://axto.io/api/license-validate"
  console_password: "GANTI_PASSWORD_INI"
  worker_token: "GANTI_TOKEN_INI"
  max_workers: ${MW}
  ai_pool:
    default_routing: cost
    fallback: true
    providers:
      - provider: groq
        api_key: "gsk_REPLACE_YOUR_GROQ_KEY"
        model: "llama-3.1-8b-instant"
      - provider: deepseek
        api_key: "sk-REPLACE_YOUR_DEEPSEEK_KEY"
        model: "deepseek-chat"
      # - provider: openai
      #   api_key: "sk-REPLACE_ME"
      # - provider: ollama
      #   base_url: "http://localhost:11434"
      #   model: "llama3"
  autoscaler: { enabled: false, threshold: 20, max_cpu_workers: ${MW}, max_gpu_workers: ${MG} }
  log_retention_days: 90
CONFIGYML
            ;;
          esac

          # ── docker-compose per product ─────────────────────────────────────
          case "$PROD" in

            guardian-core)
              cat > "${DIST}/docker-compose.yml" << CONFIGYML
version: "3.9"
# AXTO Guardian Core | Build: ${BID} | ${TAG}
services:
  guardian-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: \${GUARDIAN_DB_PASSWORD:?set in .env}
      POSTGRES_DB: guardian
    volumes: [guardian-db-data:/var/lib/postgresql/data]
    networks: [guardian-net]
  guardian-core:
    image: axto/guardian-core:${TAG}
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: [guardian-db]
    volumes: [./guardian.yml:/guardian/config/guardian.yml:ro, guardian-data:/guardian/data]
    environment:
      - GUARDIAN_CONFIG=/guardian/config/guardian.yml
      - "GUARDIAN_DB_URL=postgresql://guardian:\${GUARDIAN_DB_PASSWORD}@guardian-db:5432/guardian"
    networks: [guardian-net]
volumes: { guardian-db-data: {}, guardian-data: {} }
networks: { guardian-net: { driver: bridge } }
CONFIGYML
            ;;

            guardian-node)
              cat > "${DIST}/docker-compose.yml" << CONFIGYML
version: "3.9"
# AXTO Guardian Node Agent | Build: ${BID} | ${TAG}
# Jalankan di setiap server yang ingin dilindungi
services:
  guardian-node:
    image: axto/guardian-node:${TAG}
    restart: unless-stopped
    privileged: true
    cap_add: [NET_ADMIN, SYS_PTRACE, KILL]
    volumes: [/:/host:ro, ./guardian.yml:/guardian/config/guardian.yml:ro, guardian-quarantine:/guardian/quarantine]
    environment:
      - GUARDIAN_CORE_URL=http://GUARDIAN_CORE_IP:8080
      - GUARDIAN_CONFIG=/guardian/config/guardian.yml
    networks: [guardian-net]
volumes: { guardian-quarantine: {} }
networks: { guardian-net: { driver: bridge } }
CONFIGYML
            ;;

            guardian-clamav)
              cat > "${DIST}/docker-compose.yml" << CONFIGYML
version: "3.9"
# AXTO ClamAV Antivirus Sidecar | Build: ${BID} | ${TAG}
services:
  clamav:
    image: axto/guardian-clamav:${TAG}
    restart: unless-stopped
    environment: [CLAMAV_NO_FRESHCLAMD=false, CLAMAV_NO_CLAMD=false]
    volumes: [clamav-db:/var/lib/clamav, /:/scan-host:ro, guardian-quarantine:/guardian/quarantine]
    ports: ["3310:3310"]
    networks: [guardian-net]
volumes: { clamav-db: {}, guardian-quarantine: {} }
networks: { guardian-net: { driver: bridge } }
CONFIGYML
            ;;

            guardian-core-node)
              cat > "${DIST}/docker-compose.yml" << CONFIGYML
version: "3.9"
# AXTO Guardian Core + Node Agent | Build: ${BID} | ${TAG}
# Includes: guardian-core (REST API + Dashboard) + guardian-node (threat detection agent)
# Add ClamAV separately or upgrade to guardian-bundle for full antivirus integration
services:
  guardian-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: \${GUARDIAN_DB_PASSWORD:?set in .env}
      POSTGRES_DB: guardian
    volumes: [guardian-db-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U guardian"], interval: 10s, timeout: 5s, retries: 5 }
    networks: [guardian-net]
  guardian-core:
    image: axto/guardian-core:${TAG}
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: { guardian-db: { condition: service_healthy } }
    volumes: [./guardian.yml:/guardian/config/guardian.yml:ro, guardian-data:/guardian/data, guardian-logs:/guardian/logs]
    environment:
      - GUARDIAN_CONFIG=/guardian/config/guardian.yml
      - "GUARDIAN_DB_URL=postgresql://guardian:\${GUARDIAN_DB_PASSWORD}@guardian-db:5432/guardian"
    healthcheck: { test: ["CMD","curl","-sf","http://localhost:8080/health"], interval: 30s, timeout: 10s, retries: 3 }
    networks: [guardian-net]
  guardian-node:
    image: axto/guardian-node:${TAG}
    restart: unless-stopped
    privileged: true
    cap_add: [NET_ADMIN, SYS_PTRACE, KILL]
    depends_on: [guardian-core]
    volumes: [/:/host:ro, ./guardian.yml:/guardian/config/guardian.yml:ro, guardian-quarantine:/guardian/quarantine]
    environment:
      - GUARDIAN_CORE_URL=http://guardian-core:8080
      - GUARDIAN_CONFIG=/guardian/config/guardian.yml
    networks: [guardian-net]
volumes: { guardian-db-data: {}, guardian-data: {}, guardian-logs: {}, guardian-quarantine: {} }
networks: { guardian-net: { driver: bridge } }
CONFIGYML
