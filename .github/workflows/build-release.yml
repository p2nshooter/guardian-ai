          cat > "${D}/install.sh" << 'BASH'
#!/bin/bash
set -euo pipefail
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
echo "======================================"
echo "  AXTO AI Platform — Linux Setup"
echo "======================================"
chmod +x "${DIR}"/guardian-core "${DIR}"/guardian-node \
         "${DIR}"/orchestra-core "${DIR}"/orchestra-worker-cpu \
         "${DIR}"/orchestra-worker-gpu 2>/dev/null || true

install_service() {
  local name=$1 bin=$2 cfg=$3
  [ -f "${DIR}/${bin}" ] || return 0
  cat > /etc/systemd/system/${name}.service << SVC
[Unit]
Description=AXTO ${name}
After=network.target
[Service]
Type=simple
WorkingDirectory=${DIR}
ExecStart=${DIR}/${bin} --config ${DIR}/${cfg}
Restart=always
RestartSec=5
StandardOutput=journal
[Install]
WantedBy=multi-user.target
SVC
  systemctl daemon-reload
  systemctl enable ${name} && systemctl start ${name}
  echo "  ✅ ${name} started"
}

install_service axto-guardian-core    guardian-core    guardian.yml
install_service axto-guardian-node    guardian-node    guardian.yml
install_service axto-orchestra-core   orchestra-core   orchestra.yml
install_service axto-worker-cpu       orchestra-worker-cpu  orchestra.yml
install_service axto-worker-gpu       orchestra-worker-gpu  orchestra.yml

[ -f "${DIR}/install-clamav.sh" ] && bash "${DIR}/install-clamav.sh"

echo ""
echo "⚠️  PENTING: Edit guardian.yml / orchestra.yml"
echo "   → Isi license_key dengan license dari AXTO"
echo "   → Isi AI API key"
echo ""
echo "Dashboard: http://$(hostname -I | awk '{print $1}'):8080"
BASH
