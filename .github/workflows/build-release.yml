      - name: 📦 Package zip
        id: zip
        run: |
          DIST="dist/${{ inputs.build_id }}"
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="axto-${TAG}-docker-${{ inputs.product }}.zip"
          cd "${DIST}" && zip -r "../../${ZIP}" .
          cd ../..
          SIZE=$(stat -c%s "${ZIP}" 2>/dev/null || stat -f%z "${ZIP}" 2>/dev/null || echo 0)
          echo "zip=${ZIP}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "📦 Total: $(ls -lh ${ZIP} | awk '{print $5}')"

      - name: ☁️ Upload ke Cloudflare R2
        id: r2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ${{ secrets.CF_R2_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.CF_R2_BUCKET }}
        run: |
          pip install --quiet "awscli>=1.32"
          ZIP="${{ steps.zip.outputs.zip }}"
          R2_KEY="${{ inputs.r2_upload_key }}"
          [ -z "$R2_KEY" ] && R2_KEY="builds/${{ inputs.build_id }}/$(basename $ZIP)"
          BUCKET="${R2_BUCKET:-axto-artifacts}"
          aws s3 cp "${ZIP}" "s3://${BUCKET}/${R2_KEY}" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "r2_key=${R2_KEY}" >> $GITHUB_OUTPUT
          echo "✅ Uploaded → ${BUCKET}/${R2_KEY} ($(ls -lh ${ZIP} | awk '{print $5}'))"

      - name: 📡 Notify dashboard
        if: always()
        run: |
          STATUS=${{ job.status == 'success' && '"ready"' || '"failed"' }}
          TAG="${{ steps.meta.outputs.tag }}"
          R2_KEY="${{ steps.r2.outputs.r2_key }}"
          SIZE="${{ steps.zip.outputs.size }}"
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CALLBACK_URL="${{ inputs.callback_url }}"
          CALLBACK_SECRET="${{ inputs.callback_secret }}"
          [ -z "$CALLBACK_URL" ] && CALLBACK_URL="${{ secrets.AXTO_APP_URL }}/api/admin/engine-builder"
          [ -z "$CALLBACK_SECRET" ] && CALLBACK_SECRET="${{ secrets.BUILD_WEBHOOK_SECRET }}"
          [ -z "$CALLBACK_URL" ] && exit 0
          curl -sf -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Build-Webhook-Secret: ${CALLBACK_SECRET}" \
            -d "{\"action\":\"webhook_build_complete\",\"build_id\":\"${{ inputs.build_id }}\",\"status\":${STATUS},\"tag\":\"${TAG}\",\"r2_key\":\"${R2_KEY}\",\"artifact_size\":${SIZE},\"run_url\":\"${RUN}\"}" || true

      - name: 📋 Summary
