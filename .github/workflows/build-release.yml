      - name: 📦 Package zip
        id: zip
        run: |
          D="${{ steps.v.outputs.dist }}"
          TAG="${{ steps.v.outputs.tag }}"
          ZIP="axto-${TAG}-linux-${{ inputs.product }}.zip"
          cd "${D}" && zip -r "../../${ZIP}" .
          cd ../..
          SIZE=$(stat -c%s "${ZIP}" 2>/dev/null || echo 0)
          echo "zip=${ZIP}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "📦 $(ls -lh ${ZIP} | awk '{print $5}')"
          ls -lh "${D}/"

      - name: ☁️ Upload ke Cloudflare R2
        id: r2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ${{ secrets.CF_R2_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.CF_R2_BUCKET }}
        run: |
          pip install --quiet "awscli>=1.32"
          ZIP="${{ steps.zip.outputs.zip }}"
          R2_KEY="${{ inputs.r2_upload_key }}"
          [ -z "$R2_KEY" ] && R2_KEY="builds/${{ inputs.build_id }}/$(basename $ZIP)"
          BUCKET="${R2_BUCKET:-axto-artifacts}"
          aws s3 cp "${ZIP}" "s3://${BUCKET}/${R2_KEY}" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "r2_key=${R2_KEY}" >> $GITHUB_OUTPUT
          echo "✅ Uploaded → ${BUCKET}/${R2_KEY}"

      - name: 📡 Notify dashboard
        if: always()
        run: |
          STATUS=${{ job.status == 'success' && '"ready"' || '"failed"' }}
          TAG="${{ steps.v.outputs.tag }}"
          R2_KEY="${{ steps.r2.outputs.r2_key }}"
          SIZE="${{ steps.zip.outputs.size }}"
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CALLBACK_URL="${{ inputs.callback_url }}"
          CALLBACK_SECRET="${{ inputs.callback_secret }}"
          [ -z "$CALLBACK_URL" ] && CALLBACK_URL="${{ secrets.AXTO_APP_URL }}/api/admin/engine-builder"
          [ -z "$CALLBACK_SECRET" ] && CALLBACK_SECRET="${{ secrets.BUILD_WEBHOOK_SECRET }}"
          [ -z "$CALLBACK_URL" ] && exit 0
          curl -sf -X POST "${CALLBACK_URL}" \
            -H "Content-Type: application/json" \
            -H "X-Build-Webhook-Secret: ${CALLBACK_SECRET}" \
            -d "{\"action\":\"webhook_build_complete\",\"build_id\":\"${{ inputs.build_id }}\",\"status\":${STATUS},\"tag\":\"${TAG}\",\"r2_key\":\"${R2_KEY}\",\"artifact_size\":${SIZE},\"run_url\":\"${RUN}\"}" || true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — EXE WINDOWS (PyInstaller .exe)
# License TIDAK di-embed — client input license key saat pertama run
# ─────────────────────────────────────────────────────────────────────────────
  build-exe-windows:
    name: "🪟 EXE Windows [${{ inputs.product }}]"
    runs-on: windows-latest
    if: inputs.build_type == 'exe' && inputs.arch == 'windows/amd64'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set vars
        id: v
        shell: bash
        run: |
          TAG="client-$(echo '${{ inputs.build_id }}' | cut -c1-8)"
          DIST="dist/${{ inputs.build_id }}"
          mkdir -p "${DIST}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "dist=${DIST}" >> $GITHUB_OUTPUT
          PROD="${{ inputs.product }}"
          NEED_GUARDIAN_CORE=false; NEED_GUARDIAN_NODE=false
          NEED_ORCHESTRA_CORE=false; NEED_WORKER_CPU=false; NEED_WORKER_GPU=false
          case "$PROD" in
            guardian-core)        NEED_GUARDIAN_CORE=true ;;
            guardian-node)        NEED_GUARDIAN_NODE=true ;;
            guardian-core-node)   NEED_GUARDIAN_CORE=true; NEED_GUARDIAN_NODE=true ;;
            guardian-bundle)      NEED_GUARDIAN_CORE=true; NEED_GUARDIAN_NODE=true ;;
            orchestra-core-cpu)   NEED_ORCHESTRA_CORE=true; NEED_WORKER_CPU=true ;;
            orchestra-core)       NEED_ORCHESTRA_CORE=true ;;
            orchestra-worker-cpu) NEED_WORKER_CPU=true ;;
            orchestra-worker-gpu) NEED_WORKER_GPU=true ;;
            orchestra-bundle)     NEED_ORCHESTRA_CORE=true; NEED_WORKER_CPU=true; NEED_WORKER_GPU=true ;;
            full-bundle)          NEED_GUARDIAN_CORE=true; NEED_GUARDIAN_NODE=true
                                  NEED_ORCHESTRA_CORE=true; NEED_WORKER_CPU=true ;;
          esac
          echo "need_guardian_core=${NEED_GUARDIAN_CORE}"   >> $GITHUB_OUTPUT
          echo "need_guardian_node=${NEED_GUARDIAN_NODE}"   >> $GITHUB_OUTPUT
          echo "need_orchestra_core=${NEED_ORCHESTRA_CORE}" >> $GITHUB_OUTPUT
          echo "need_worker_cpu=${NEED_WORKER_CPU}"         >> $GITHUB_OUTPUT
          echo "need_worker_gpu=${NEED_WORKER_GPU}"         >> $GITHUB_OUTPUT

      - name: Install deps
        shell: bash
        run: |
          pip install --quiet pyinstaller==6.9.0
          [[ "${{ steps.v.outputs.need_guardian_core }}" == "true" || "${{ steps.v.outputs.need_guardian_node }}" == "true" ]] && \
            pip install --quiet -r engine/requirements.txt || true
          [[ "${{ steps.v.outputs.need_orchestra_core }}" == "true" || "${{ steps.v.outputs.need_worker_cpu }}" == "true" ]] && \
            pip install --quiet -r orchestra/orchestra_core/requirements.txt && \
            pip install --quiet -r orchestra/orchestra_worker/requirements.txt || true

      - name: Build guardian-core.exe
        if: steps.v.outputs.need_guardian_core == 'true'
        shell: cmd
        run: |
          cd engine
          pyinstaller --onefile --name guardian-core ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-gcore --specpath C:\Temp ^
            --add-data "src\support_ui.html;src" ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --hidden-import asyncpg --hidden-import aiosqlite ^
            --collect-all structlog --collect-all pydantic ^
            src\api.py

      - name: Build guardian-node.exe
        if: steps.v.outputs.need_guardian_node == 'true'
        shell: cmd
        run: |
          cd engine
          pyinstaller --onefile --name guardian-node ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-gnode --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --collect-all structlog --collect-all pydantic ^
            src\__main__.py

      - name: Build orchestra-core.exe
        if: steps.v.outputs.need_orchestra_core == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-core ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-ocore --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.lifespan.on ^
            --collect-all structlog --collect-all pydantic ^
            orchestra_core\main.py

      - name: Build orchestra-worker-cpu.exe
        if: steps.v.outputs.need_worker_cpu == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-worker-cpu ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-wcpu --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --collect-all structlog ^
            orchestra_worker\worker_cpu.py

      - name: Build orchestra-worker-gpu.exe
        if: steps.v.outputs.need_worker_gpu == 'true'
        shell: cmd
        run: |
          cd orchestra
          pyinstaller --onefile --name orchestra-worker-gpu ^
            --distpath "..\${{ steps.v.outputs.dist }}" ^
            --workpath C:\Temp\pyi-wgpu --specpath C:\Temp ^
            --hidden-import uvicorn.logging ^
            --collect-all structlog ^
            orchestra_worker\worker_gpu.py

      - name: Generate config + install.bat
        shell: bash
        run: |
          D="${{ steps.v.outputs.dist }}"
          TAG="${{ steps.v.outputs.tag }}"
          CLIENT="${{ inputs.client_name }}"
          MN="${{ inputs.max_nodes }}"
          MW="${{ inputs.max_workers }}"
          LT="${{ inputs.license_type }}"
          PROD="${{ inputs.product }}"

          cat > "${D}/guardian.yml" << CONFIGYML
