#!/bin/bash
# AXTO Engine Installer
set -euo pipefail
DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
echo "======================================"
echo "  AXTO AI Platform — Setup"
echo "======================================"

command -v docker &>/dev/null || { echo "ERROR: Install Docker dulu: https://docs.docker.com/get-docker/"; exit 1; }

# Load images dari .tar.gz (tidak butuh internet / registry)
echo "Loading Docker images..."
for f in "${DIR}"/*.tar.gz; do
  [ -f "$f" ] || continue
  echo "  → Loading $(basename $f)..."
  docker load < "$f"
done

# Generate .env jika belum ada
[ ! -f "${DIR}/.env" ] && {
  printf 'GUARDIAN_DB_PASSWORD=%s\nORCHESTRA_DB_PASSWORD=%s\nWORKER_TOKEN=%s\n' \
    "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -hex 24)" \
    > "${DIR}/.env"
  echo "✅ .env generated"
}

echo ""
echo "⚠️  PENTING: Edit guardian.yml dan/atau orchestra.yml"
echo "   → Isi license_key dengan license dari AXTO"
echo "   → Isi AI API key (OpenAI/Groq/dll)"
echo "   → Ganti password default"
echo ""
echo "Setelah selesai edit, jalankan:"
echo "  docker compose up -d"
echo ""
echo "Dashboard: http://$(hostname -I | awk '{print $1}'):8080"
BASH
