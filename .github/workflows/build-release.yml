      - name: Package zip
        id: zip
        shell: bash
        run: |
          D="${{ steps.v.outputs.dist }}"
          TAG="${{ steps.v.outputs.tag }}"
          ZIP="axto-${TAG}-windows-${{ inputs.product }}.zip"
          cd "${D}" && 7z a "../../${ZIP}" . > /dev/null
          cd ../..
          echo "zip=${ZIP}" >> $GITHUB_OUTPUT
          ls -lh "${ZIP}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ inputs.build_id }}"
          name: "[${{ inputs.product }}] ${{ inputs.client_name }} — ${{ inputs.license_type }}"
          draft: false
          prerelease: true
          files: ${{ steps.zip.outputs.zip }}
          body: |
            **Windows EXE Build — ${{ inputs.product }}**
            Client: ${{ inputs.client_name }} / ${{ inputs.client_email }}
            License: `${{ inputs.license_type }}` | Build: `${{ inputs.build_id }}`
            > Standalone .exe files. No Python or Docker needed.
            > ⚠️ Prerelease — delete after client downloads.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify dashboard
        if: always()
        shell: bash
        run: |
          STATUS=${{ job.status == 'success' && '"ready"' || '"failed"' }}
          TAG="${{ steps.v.outputs.tag }}"
          DL="https://github.com/${{ github.repository }}/releases/tag/build-${{ inputs.build_id }}"
          RUN="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf -X POST "${{ secrets.AXTO_APP_URL }}/api/admin/engine-builder" \
            -H "Content-Type: application/json" \
            -H "X-Build-Webhook-Secret: ${{ secrets.BUILD_WEBHOOK_SECRET }}" \
            -d "{\"action\":\"webhook_build_complete\",\"build_id\":\"${{ inputs.build_id }}\",\"status\":${STATUS},\"tag\":\"${TAG}\",\"download_url\":\"${DL}\",\"run_id\":\"${{ github.run_id }}\",\"run_url\":\"${RUN}\"}" || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### 🪟 EXE Windows — ${{ inputs.product }}" >> $GITHUB_STEP_SUMMARY
          echo "**[Download](https://github.com/${{ github.repository }}/releases/tag/build-${{ inputs.build_id }})**" >> $GITHUB_STEP_SUMMARY
