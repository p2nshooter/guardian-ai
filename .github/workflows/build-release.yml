# AXTO Engine Builder — Per-Client Build Pipeline (Extended with Vault)
#
# Flow:
#   Docker → build image lokal → docker save → gzip → zip → upload CF R2
#   EXE    → PyInstaller compile binary → zip → upload CF R2
#
# License TIDAK di-embed ke binary.
# Client wajib input license key saat pertama run → validasi ke axto.io
#
# Trigger: workflow_dispatch (dari admin dashboard atau manual)
# Artifacts: CF R2 axto-builds/builds/<build_id>/
# ═══════════════════════════════════════════════════════════════════════════════

name: Build Client Release

on:
  workflow_dispatch:
    inputs:
      build_id:        { description: "Engine build ID",                                     required: true  }
      product:         { description: "Product to build (see options below)",                required: true, default: "vault-core" }
      # Products: guardian-core|guardian-node|guardian-antivirus
      #           orchestra-core|orchestra-worker-cpu|orchestra-worker-gpu
      #           vault-core
      #           guardian-bundle|orchestra-bundle|vault-bundle|full-bundle
      build_type:      { description: "docker | exe",                                        required: true, default: "docker" }
      arch:            { description: "linux/amd64 | linux/arm64 | windows/amd64",          required: false, default: "linux/amd64" }
      client_name:     { description: "Client name (for metadata)",                         required: false, default: "" }
      client_email:    { description: "Client email",                                        required: false, default: "" }
      license_type:    { description: "trial | monthly | yearly | lifetime",                required: true, default: "yearly" }
      trial_days:      { description: "Trial days 1-7 (only for trial type)",               required: false, default: "0" }
      max_nodes:       { description: "Max nodes/instances",                                required: false, default: "1" }
      max_workers:     { description: "Max workers (Orchestra only)",                       required: false, default: "10" }
      unlimited:       { description: "Unlimited: 1|0",                                    required: false, default: "0" }
      r2_upload_key:   { description: "CF R2 destination key (auto-generated if empty)",   required: false, default: "" }
      callback_url:    { description: "Webhook URL to notify dashboard after build",        required: false, default: "" }
      callback_secret: { description: "Webhook HMAC secret",                               required: false, default: "" }

# ─────────────────────────────────────────────────────────────────────────────
# DOCKER BUILD
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-docker:
    name: "🐳 Docker [${{ inputs.product }}]"
    runs-on: ubuntu-latest
    if: inputs.build_type == 'docker'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # ── Determine which images to build based on product selection ──────────
      - name: Set build metadata
        id: meta
        run: |
          TAG="client-$(echo '${{ inputs.build_id }}' | cut -c1-8)"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          PROD="${{ inputs.product }}"
          
          # Initialize all flags false
          BUILD_GUARDIAN_CORE=false; BUILD_GUARDIAN_NODE=false; BUILD_CLAMAV=false
          BUILD_ORCHESTRA_CORE=false; BUILD_WORKER_CPU=false; BUILD_WORKER_GPU=false
          BUILD_VAULT_CORE=false
          
          case "$PROD" in
            # Individual products
            guardian-core)          BUILD_GUARDIAN_CORE=true ;;
            guardian-node)          BUILD_GUARDIAN_NODE=true ;;
            guardian-antivirus)     BUILD_CLAMAV=true ;;
            guardian-core-node)     BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true ;;
            guardian-bundle)        BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true; BUILD_CLAMAV=true ;;
            orchestra-core)         BUILD_ORCHESTRA_CORE=true ;;
            orchestra-worker-cpu)   BUILD_WORKER_CPU=true ;;
            orchestra-worker-gpu)   BUILD_WORKER_GPU=true ;;
            orchestra-core-cpu)     BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true ;;
            orchestra-bundle)       BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true; BUILD_WORKER_GPU=true ;;
            vault-core)             BUILD_VAULT_CORE=true ;;
            vault-bundle)           BUILD_VAULT_CORE=true ;;
            full-bundle)            BUILD_GUARDIAN_CORE=true; BUILD_GUARDIAN_NODE=true; BUILD_CLAMAV=true
                                    BUILD_ORCHESTRA_CORE=true; BUILD_WORKER_CPU=true; BUILD_WORKER_GPU=true
                                    BUILD_VAULT_CORE=true ;;
            *)                      echo "ERROR: Unknown product: $PROD"; exit 1 ;;
          esac
          
          echo "build_guardian_core=${BUILD_GUARDIAN_CORE}"       >> $GITHUB_OUTPUT
          echo "build_guardian_node=${BUILD_GUARDIAN_NODE}"       >> $GITHUB_OUTPUT
          echo "build_clamav=${BUILD_CLAMAV}"                     >> $GITHUB_OUTPUT
          echo "build_orchestra_core=${BUILD_ORCHESTRA_CORE}"     >> $GITHUB_OUTPUT
          echo "build_worker_cpu=${BUILD_WORKER_CPU}"             >> $GITHUB_OUTPUT
          echo "build_worker_gpu=${BUILD_WORKER_GPU}"             >> $GITHUB_OUTPUT
          echo "build_vault_core=${BUILD_VAULT_CORE}"             >> $GITHUB_OUTPUT
          echo "tag=${TAG}"                                        >> $GITHUB_OUTPUT

      # ── Build each component conditionally ────────────────────────────────
      - name: Build Guardian Core
        if: steps.meta.outputs.build_guardian_core == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: false
          load: true
          tags: axto/guardian-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=guardian-core
          cache-to: type=gha,mode=max,scope=guardian-core

      - name: Build Guardian Node
        if: steps.meta.outputs.build_guardian_node == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile.node
          push: false
          load: true
          tags: axto/guardian-node:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=guardian-node
          cache-to: type=gha,mode=max,scope=guardian-node

      - name: Build Guardian Antivirus
        if: steps.meta.outputs.build_clamav == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./antivirus
          file: ./antivirus/Dockerfile
          push: false
          load: true
          tags: axto/guardian-antivirus:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=guardian-antivirus
          cache-to: type=gha,mode=max,scope=guardian-antivirus

      - name: Build Orchestra Core
        if: steps.meta.outputs.build_orchestra_core == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile
          push: false
          load: true
          tags: axto/orchestra-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-core
          cache-to: type=gha,mode=max,scope=orchestra-core

      - name: Build Orchestra Worker CPU
        if: steps.meta.outputs.build_worker_cpu == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile.worker-cpu
          push: false
          load: true
          tags: axto/orchestra-worker-cpu:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-worker-cpu
          cache-to: type=gha,mode=max,scope=orchestra-worker-cpu

      - name: Build Orchestra Worker GPU
        if: steps.meta.outputs.build_worker_gpu == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./orchestra
          file: ./orchestra/Dockerfile.worker-gpu
          push: false
          load: true
          tags: axto/orchestra-worker-gpu:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=orchestra-worker-gpu
          cache-to: type=gha,mode=max,scope=orchestra-worker-gpu

      # ── 🔐 VAULT CORE ────────────────────────────────────────────────────────
      - name: Build Vault Core
        if: steps.meta.outputs.build_vault_core == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./vault
          file: ./vault/Dockerfile
          push: false
          load: true
          tags: axto/vault-core:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=vault-core
          cache-to: type=gha,mode=max,scope=vault-core

      # ── Package + Upload to R2 ────────────────────────────────────────────
      - name: Package & upload to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ec77c7422c83e094aa03df0b3f94e488
          R2_BUCKET:             axto-builds
          BUILD_ID:              ${{ inputs.build_id }}
          PRODUCT:               ${{ inputs.product }}
          TAG:                   ${{ steps.meta.outputs.tag }}
          BUILD_GUARDIAN_CORE:   ${{ steps.meta.outputs.build_guardian_core }}
          BUILD_GUARDIAN_NODE:   ${{ steps.meta.outputs.build_guardian_node }}
          BUILD_CLAMAV:          ${{ steps.meta.outputs.build_clamav }}
          BUILD_ORCHESTRA_CORE:  ${{ steps.meta.outputs.build_orchestra_core }}
          BUILD_WORKER_CPU:      ${{ steps.meta.outputs.build_worker_cpu }}
          BUILD_WORKER_GPU:      ${{ steps.meta.outputs.build_worker_gpu }}
          BUILD_VAULT_CORE:      ${{ steps.meta.outputs.build_vault_core }}
        run: |
          pip install -q "awscli>=1.32"
          
          R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE_KEY="${{ inputs.r2_upload_key }}"
          [ -z "$BASE_KEY" ] && BASE_KEY="builds/${BUILD_ID}"
          
          upload_image() {
            local name=$1
            local tag_name=$2
            echo "💾 Packaging ${name}..."
            docker save "axto/${name}:${TAG}" | gzip -9 > "${name}.tar.gz"
            echo "   Size: $(du -sh ${name}.tar.gz | cut -f1)"
            aws s3 cp "${name}.tar.gz" \
              "s3://${R2_BUCKET}/${BASE_KEY}/raw/${name}.tar.gz" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            aws s3 cp "${name}.tar.gz" \
              "s3://${R2_BUCKET}/builds/latest/raw/${name}.tar.gz" \
              --endpoint-url "$R2_ENDPOINT" --no-progress
            echo "   ✅ ${name} → R2"
          }
          
          [ "$BUILD_GUARDIAN_CORE"  == "true" ] && upload_image "guardian-core"       "guardian-core"
          [ "$BUILD_GUARDIAN_NODE"  == "true" ] && upload_image "guardian-node"       "guardian-node"
          [ "$BUILD_CLAMAV"         == "true" ] && upload_image "guardian-antivirus"  "guardian-antivirus"
          [ "$BUILD_ORCHESTRA_CORE" == "true" ] && upload_image "orchestra-core"      "orchestra-core"
          [ "$BUILD_WORKER_CPU"     == "true" ] && upload_image "orchestra-worker-cpu" "orchestra-worker-cpu"
          [ "$BUILD_WORKER_GPU"     == "true" ] && upload_image "orchestra-worker-gpu" "orchestra-worker-gpu"
          [ "$BUILD_VAULT_CORE"     == "true" ] && upload_image "vault-core"          "vault-core"
          
          echo ""
          echo "══════════════════════════════════════"
          echo "  Build Complete: ${PRODUCT}"
          echo "  Build ID:       ${BUILD_ID}"
          echo "  R2 Path:        ${BASE_KEY}/"
          echo "══════════════════════════════════════"

      # ── Callback to dashboard ──────────────────────────────────────────────
      - name: Notify dashboard
        if: always() && inputs.callback_url != ''
        run: |
          STATUS="${{ job.status }}"
          curl -sf --max-time 15 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ inputs.callback_secret }}" \
            -d "{
              \"action\":   \"build_callback\",
              \"build_id\": \"${{ inputs.build_id }}\",
              \"product\":  \"${{ inputs.product }}\",
              \"type\":     \"docker\",
              \"status\":   \"${STATUS}\",
              \"version\":  \"${{ steps.meta.outputs.tag }}\"
            }" || echo "⚠️ Callback failed (non-fatal)"

# ─────────────────────────────────────────────────────────────────────────────
# EXE BUILD (Windows — PyInstaller)
# ─────────────────────────────────────────────────────────────────────────────
  build-exe:
    name: "🪟 Windows EXE [${{ inputs.product }}]"
    runs-on: windows-latest
    if: inputs.build_type == 'exe'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install PyInstaller
        run: pip install pyinstaller==6.3.0

      - name: Determine source directory
        id: src
        shell: bash
        run: |
          PROD="${{ inputs.product }}"
          case "$PROD" in
            guardian-core|guardian-node|guardian-antivirus|guardian-bundle) SRC="engine" ;;
            orchestra-core|orchestra-worker-cpu|orchestra-worker-gpu|orchestra-bundle) SRC="orchestra" ;;
            vault-core|vault-bundle) SRC="vault" ;;
            full-bundle) SRC="engine" ;;  # builds guardian launcher for full bundle
            *) echo "ERROR: Unknown product: $PROD"; exit 1 ;;
          esac
          echo "src=${SRC}" >> $GITHUB_OUTPUT
          echo "Building EXE from ./${SRC}"

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r ./${{ steps.src.outputs.src }}/requirements.txt

      - name: Build EXE with PyInstaller
        shell: bash
        env:
          PRODUCT: ${{ inputs.product }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          PROD="${{ inputs.product }}"
          SRC="${{ steps.src.outputs.src }}"
          EXE_NAME="axto-${PROD}"
          
          pyinstaller \
            --onefile \
            --name "${EXE_NAME}" \
            --add-data "${SRC}/src/activation.html;src" \
            --add-data "${SRC}/src/support_ui.html;src" \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols \
            --hidden-import=uvicorn.protocols.http \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=uvicorn.lifespan \
            --hidden-import=uvicorn.lifespan.on \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all structlog \
            --icon NONE \
            "${SRC}/src/__main__.py"
          
          ls -lh "dist/${EXE_NAME}.exe"
          echo "✅ EXE built: dist/${EXE_NAME}.exe"

      - name: Upload EXE to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ec77c7422c83e094aa03df0b3f94e488
          R2_BUCKET:             axto-builds
          BUILD_ID:              ${{ inputs.build_id }}
          PRODUCT:               ${{ inputs.product }}
        run: |
          pip install -q "awscli>=1.32"
          
          EXE_NAME="axto-${PRODUCT}"
          R2_ENDPOINT="https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE_KEY="${{ inputs.r2_upload_key }}"
          [ -z "$BASE_KEY" ] && BASE_KEY="builds/${BUILD_ID}"
          
          aws s3 cp "dist/${EXE_NAME}.exe" \
            "s3://${R2_BUCKET}/${BASE_KEY}/exe/${PRODUCT}-windows.exe" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          
          aws s3 cp "dist/${EXE_NAME}.exe" \
            "s3://${R2_BUCKET}/builds/latest/exe/${PRODUCT}-windows.exe" \
            --endpoint-url "$R2_ENDPOINT" --no-progress
          
          echo "✅ EXE uploaded → R2 ${BASE_KEY}/exe/${PRODUCT}-windows.exe"

      - name: Notify dashboard
        if: always() && inputs.callback_url != ''
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          curl -sf --max-time 15 -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ inputs.callback_secret }}" \
            -d "{\"action\":\"build_callback\",\"build_id\":\"${{ inputs.build_id }}\",\"product\":\"${{ inputs.product }}\",\"type\":\"exe\",\"status\":\"${STATUS}\"}" \
            || echo "⚠️ Callback failed (non-fatal)"
