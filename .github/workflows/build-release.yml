echo.
echo Dashboard: http://localhost:8080
pause
goto :eof
:svc
if not exist %2 goto :eof
sc create %~1 binPath= "%~2 --config %~3" start= auto 2>nul
sc start %~1 >nul 2>&1
echo   %~1 registered
goto :eof
BAT

