# ==============================================================================
# Quality gate (blueprint §10): the FULL end-to-end suite on a fresh local
# Cloudflare runtime (D1 / KV / R2 via wrangler) — auth, billing, every gateway
# path, Lifetime licences, BYOX, every cloud app — plus the REAL licence code
# of all 13 engines and the AXTO Setup installer, both in Docker.
# Runs on every push that touches the platform, and every night.
# ==============================================================================
name: E2E

on:
  push:
    paths:
      - 'dashboard/**'
      - 'installer/**'
      - '*/src/license.py'
      - 'orchestra/orchestra_core/**'
      - '*-compose.yml'
      - '*.example.yml'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Full E2E (local Cloudflare runtime + engines + installer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Install
        run: npm ci --prefer-offline
      - name: Types + unit tests
        run: npx tsc --noEmit -p . && npm test
      - name: E2E
        run: bash tests/e2e/run.sh
      - name: Server log on failure
        if: failure()
        run: tail -200 .e2e-state-serve.log || true
