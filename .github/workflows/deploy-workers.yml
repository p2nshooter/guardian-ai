# Deploys the AXTO cron Workers (currently: crypto-payment watcher) to Cloudflare.
# The crypto watcher issues a client's Smart License automatically, within ~1 min
# of their crypto payment confirming on-chain.
#
# Required secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit), CRON_SECRET
name: Deploy Cron Workers → Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-workers/crypto-watch-cron.ts"
      - "cloudflare-workers/wrangler-crypto-watch.toml"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch: {}

jobs:
  crypto-watch:
    name: Deploy crypto-watch cron worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy worker + set CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN missing — skipping."; exit 0; fi
          # Deploy first (creates the worker), then push the secret (applied live).
          npx --yes wrangler@3 deploy --config wrangler-crypto-watch.toml
          if [ -n "$CRON_SECRET" ]; then
            printf '%s' "$CRON_SECRET" | npx --yes wrangler@3 secret put CRON_SECRET --config wrangler-crypto-watch.toml || echo "secret step skipped"
          else
            echo "⚠️ CRON_SECRET not set — the watcher endpoints stay protected; set the secret and re-run."
          fi
