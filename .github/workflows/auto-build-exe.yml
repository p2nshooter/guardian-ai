# Builds standalone Windows .exe binaries (PyInstaller) for the shipping products
# and uploads them to Cloudflare R2 at builds/latest/exe/<product>-windows.exe,
# which is exactly where the client portal downloads them from.
#
# Entry points differ per product:
#   guardian/antivirus/vault/edge/soc/compliance/sentinel/studio/legal
#                             → <dir>/src/__main__.py
#   orchestra                → build-scripts/exe-entrypoints/orchestra_entry.py
#                              (imports orchestra_core.main; needs --paths orchestra)
#
# collectall: only set for products depending on scikit-learn/scipy (guardian
# core/node/antivirus, orchestra-core) — their compiled, dynamically-imported
# submodules are notorious for being silently missed by PyInstaller's default
# static analysis (confirmed root cause of a real broken-exe incident: the
# build reported "success" and exited 0 while quietly shipping a stub).
#
# Trigger: manual (workflow_dispatch) or when their source changes.
# Secrets: CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY  (R2 S3 keys)
name: Build Client EXEs → R2

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "orchestra/**"
      - "antivirus/**"
      - "vault/**"
      - "edge/**"
      - "soc/**"
      - "compliance/**"
      - "sentinel/**"
      - "studio/**"
      - "legal/**"
      - "yp/**"
      - "build-scripts/exe-entrypoints/**"
      - ".github/workflows/auto-build-exe.yml"

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    name: "🪟 ${{ matrix.product }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { product: guardian-core,        reqdir: engine,    entry: "engine/src/__main__.py",    addsrc: "engine/src",    paths: "", collect: "", collectall: "sklearn numpy pandas scipy" }
          - { product: guardian-node,        reqdir: engine,    entry: "engine/src/__main__.py",    addsrc: "engine/src",    paths: "", collect: "", collectall: "sklearn numpy pandas scipy" }
          - { product: guardian-antivirus,   reqdir: antivirus, entry: "antivirus/src/__main__.py", addsrc: "antivirus/src", paths: "", collect: "", collectall: "sklearn numpy scipy" }
          - { product: orchestra-core,       reqdir: orchestra/orchestra_core,   entry: "build-scripts/exe-entrypoints/orchestra_entry.py", addsrc: "", paths: "orchestra orchestra/orchestra_core",  collect: "orchestra_core",   collectall: "sklearn numpy pandas scipy" }
          - { product: orchestra-worker-cpu, reqdir: orchestra/orchestra_worker, entry: "orchestra/orchestra_worker/worker_cpu.py",            addsrc: "", paths: "orchestra/orchestra_worker", collect: "",               collectall: "numpy" }
          - { product: vault-core,           reqdir: vault,     entry: "vault/src/__main__.py",     addsrc: "vault/src",     paths: "", collect: "", collectall: "" }
          - { product: edge-core,            reqdir: edge,       entry: "edge/src/__main__.py",       addsrc: "edge/src",       paths: "", collect: "", collectall: "" }
          - { product: soc-core,             reqdir: soc,        entry: "soc/src/__main__.py",        addsrc: "soc/src",        paths: "", collect: "", collectall: "" }
          - { product: compliance-core,      reqdir: compliance, entry: "compliance/src/__main__.py", addsrc: "compliance/src", paths: "", collect: "", collectall: "" }
          - { product: sentinel-core,        reqdir: sentinel,   entry: "sentinel/src/__main__.py",   addsrc: "sentinel/src",   paths: "", collect: "", collectall: "" }
          - { product: studio-core,          reqdir: studio,     entry: "studio/src/__main__.py",     addsrc: "studio/src",     paths: "", collect: "", collectall: "" }
          - { product: legal-core,           reqdir: legal,      entry: "legal/src/__main__.py",      addsrc: "legal/src",      paths: "", collect: "", collectall: "" }
          - { product: yp-core,              reqdir: yp,         entry: "yp/src/__main__.py",         addsrc: "yp/src",         paths: "", collect: "", collectall: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==6.3.0" "awscli>=1.32"
          if [ -f "${{ matrix.reqdir }}/requirements.txt" ]; then
            # Hard-fail on install errors — this used to be `|| echo "skipped"`,
            # which let PyInstaller silently bundle a broken exe (missing
            # modules) whenever a dependency failed to install, with the
            # build reporting green the whole time.
            pip install -r "${{ matrix.reqdir }}/requirements.txt"
          fi

      - name: Build EXE (PyInstaller)
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          ENTRY:   ${{ matrix.entry }}
          ADDSRC:  ${{ matrix.addsrc }}
          PATHS:   ${{ matrix.paths }}
          COLLECT: ${{ matrix.collect }}
          COLLECTALL: ${{ matrix.collectall }}
        run: |
          EXE_NAME="axto-${PRODUCT}"
          if [ ! -f "$ENTRY" ]; then echo "::error::entry not found: $ENTRY"; exit 1; fi
          ARGS=(--onefile --name "$EXE_NAME"
                --collect-all fastapi --collect-all pydantic --collect-all structlog
                --hidden-import=uvicorn.logging --hidden-import=uvicorn.loops
                --hidden-import=uvicorn.loops.auto --hidden-import=uvicorn.protocols
                --hidden-import=uvicorn.protocols.http --hidden-import=uvicorn.protocols.http.auto
                --hidden-import=uvicorn.lifespan --hidden-import=uvicorn.lifespan.on
                --icon NONE)
          # Add every search path (space-separated) so bare sibling imports
          # like 'import enforcement' inside orchestra_core resolve & get bundled.
          for p in $PATHS; do ARGS+=(--paths "$p"); done
          # Collect ALL submodules of the app package (catches modules that
          # PyInstaller's static analysis would otherwise miss).
          [ -n "$COLLECT" ] && ARGS+=(--collect-submodules "$COLLECT")
          # Fully collect heavy libs that ship data files (sklearn/numpy/pandas).
          for c in $COLLECTALL; do ARGS+=(--collect-all "$c"); done
          # Bundle any UI html assets that actually exist for this product.
          if [ -n "$ADDSRC" ]; then
            for f in activation.html support_ui.html dashboard.html; do
              [ -f "${ADDSRC}/${f}" ] && ARGS+=(--add-data "${ADDSRC}/${f};src")
            done
          fi
          pyinstaller "${ARGS[@]}" "$ENTRY"
          ls -lh "dist/${EXE_NAME}.exe"

          # Sanity guard: PyInstaller can exit 0 and log "completed successfully"
          # at every stage while still silently omitting modules it failed to
          # detect (this is exactly what happened to guardian-antivirus before
          # --collect-all sklearn/scipy was added — a real 15MB stub instead of
          # the ~100MB+ real bundle, that built in under 30s and crashed on
          # launch on a real Windows machine). Fail loudly instead of shipping
          # a broken artifact to a paying client.
          SIZE_BYTES=$(stat -c%s "dist/${EXE_NAME}.exe" 2>/dev/null || stat -f%z "dist/${EXE_NAME}.exe")
          MIN_BYTES=$((8 * 1024 * 1024))
          if [ "$SIZE_BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::${EXE_NAME}.exe is only ${SIZE_BYTES} bytes — suspiciously small for a bundle that includes fastapi/pydantic/uvicorn. This usually means PyInstaller silently failed to bundle a real dependency. Failing the build instead of uploading a broken exe."
            exit 1
          fi

      - name: Upload EXE to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ec77c7422c83e094aa03df0b3f94e488
          R2_BUCKET:             axto-builds
          PRODUCT:               ${{ matrix.product }}
        run: |
          aws s3 cp "dist/axto-${PRODUCT}.exe" \
            "s3://${R2_BUCKET}/builds/latest/exe/${PRODUCT}-windows.exe" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --no-progress
          echo "☁️ → R2 builds/latest/exe/${PRODUCT}-windows.exe"
