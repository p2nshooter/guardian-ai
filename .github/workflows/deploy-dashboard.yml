# AXTO Dashboard — Fast Deploy to Cloudflare Pages
# Triggers on: push to main (dashboard/ changes only), workflow_dispatch
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy Dashboard → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci --prefer-offline

      # Gate: a type error or failing unit test never reaches axto.io.
      - name: Checks (types + unit tests)
        working-directory: dashboard
        run: npx tsc --noEmit -p . && npm test

      # Records live in R2 only (CLAUDE.md §6): no D1 migrations any more. The data
      # and backup buckets exist already; creating them again is a harmless no-op.
      - name: R2 buckets for the records
        working-directory: dashboard
        run: |
          for b in axto-data axto-backups; do npx --yes wrangler@3 r2 bucket create "$b" >/dev/null 2>&1 && echo "created $b" || echo "$b exists"; done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488

      - name: Build
        working-directory: dashboard
        run: npx @cloudflare/next-on-pages && node scripts/patch-worker.mjs
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NODE_ENV: production

      - name: Deploy
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488
        # wrangler pages deploy creates the project automatically if it does not
        # exist yet, and uses the same token (Pages:Edit required).
        run: |
          npx --yes wrangler@3 pages project create axto-dashboard --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy .vercel/output/static \
            --project-name axto-dashboard --branch main --commit-dirty=true

      # Zero-touch, once: the first requests after this deploy move the records
      # from D1 to R2 (lib/data/migrate.ts); this loop drives the same steps so
      # the short maintenance window ends as fast as possible, and fails the job
      # if it does not finish. On every later deploy it is a no-op.
      - name: Move the records from D1 to R2 (once)
        working-directory: dashboard
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SHA: ${{ github.sha }}
          BASE: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
        run: |
          for i in $(seq 1 60); do
            [ "$(curl -s --max-time 20 "$BASE/api/health" | jq -r '.build // ""')" = "${SHA:0:12}" ] && break
            sleep 10
          done
          for i in $(seq 1 2000); do
            if [ -n "$CRON_SECRET" ]; then
              curl -s --max-time 90 -X POST -H "x-cron-secret: $CRON_SECRET" "$BASE/api/cron/migrate" | jq -c '{done, table, conflicts, incomplete}' 2>/dev/null || true
            else
              curl -s -o /dev/null --max-time 90 "$BASE/api/billing/options"   # every API request runs a step too
            fi
            if [ "$(curl -s --max-time 20 "$BASE/api/health" | jq -r '.records')" = "ready" ]; then
              h=$(curl -s "$BASE/api/health"); echo "$h" | jq -c '{records, movedAt, move, bindings, legacy}'
              if [ "$(echo "$h" | jq '.move.incomplete | length')" != "0" ]; then echo "::error::tables short after the move (D1 stays readable): $(echo "$h" | jq -c '.move.incomplete')"; exit 1; fi
              echo "✅ records on R2"; exit 0
            fi
          done
          echo "::error::the move from D1 to R2 did not finish — /api/health shows where it stands"; exit 1

  # Installation guides → branded PDFs (EN + ID) → R2 builds/latest/guides/,
  # served by /api/download/guide. Same source as the web guides
  # (dashboard/lib/product-guides.ts), so PDF and page never disagree.
  guides:
    name: Guide PDFs → R2
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Render guides
        working-directory: dashboard
        run: npm ci --prefer-offline && npx tsx ../scripts/ci/render-guides.mjs ../dist/guides
      - name: Build PDFs
        run: pip install --quiet reportlab && python3 scripts/ci/build-guide-pdfs.py dist/guides dist/guides
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "R2 not configured — skipping upload."; exit 0; fi
          for f in dist/guides/*.pdf; do
            bash scripts/ci/r2-put.sh "$f" "axto-builds/builds/latest/guides/$(basename "$f")" application/pdf
          done
      - uses: actions/upload-artifact@v4
        with: { name: guide-pdfs, path: dist/guides/*.pdf }
