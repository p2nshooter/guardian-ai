# AXTO Dashboard — Fast Deploy to Cloudflare Pages
# Triggers on: push to main (dashboard/ changes only), workflow_dispatch
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy Dashboard → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip D1 migration (use if already applied)"
        type: boolean
        default: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci --prefer-offline

      - name: Apply D1 Migrations
        if: ${{ !inputs.skip_migration }}
        working-directory: dashboard
        # Non-fatal: if migrations can't apply (transient/auth), the dashboard
        # still deploys. Re-run this workflow after fixing credentials to migrate.
        run: npx wrangler d1 migrations apply axto-db --remote || echo "⚠️ D1 migration skipped — dashboard will still deploy. Re-run after verifying CLOUDFLARE_API_TOKEN."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488

      - name: Seed Playbooks (R2 + D1)
        # Non-fatal: same graceful-degradation pattern as the migration step
        # above. Uploads every PDF in playbooks-pdf/ to R2 and syncs each
        # playbook's r2_key/file_size_bytes in D1 so checkout actually finds
        # a real file instead of the fabricated seed-migration placeholder.
        run: bash scripts/seed-playbooks.sh || echo "⚠️ Playbook seed skipped — dashboard will still deploy. Re-run after verifying CLOUDFLARE_API_TOKEN."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488

      - name: Build
        working-directory: dashboard
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
          NODE_ENV: production

      - name: Deploy
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488
        # wrangler pages deploy creates the project automatically if it does not
        # exist yet, and uses the same token (Pages:Edit required).
        run: |
          npx --yes wrangler@3 pages project create axto-dashboard --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy .vercel/output/static \
            --project-name axto-dashboard --branch main --commit-dirty=true
