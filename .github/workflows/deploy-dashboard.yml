# AXTO Dashboard — Fast Deploy to Cloudflare Pages
# Triggers on: push to main (dashboard/ changes only), workflow_dispatch
# ═══════════════════════════════════════════════════════════════════════════════
name: Deploy Dashboard → Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:
    inputs:
      skip_migration:
        description: "Skip D1 migration (use if already applied)"
        type: boolean
        default: false

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci --prefer-offline

      - name: Apply D1 Migrations
        if: ${{ !inputs.skip_migration }}
        working-directory: dashboard
        # Non-fatal: if migrations can't apply (transient/auth), the dashboard
        # still deploys. Re-run this workflow after fixing credentials to migrate.
        run: npx wrangler d1 migrations apply axto-db --remote || echo "⚠️ D1 migration skipped — dashboard will still deploy. Re-run after verifying CLOUDFLARE_API_TOKEN."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ec77c7422c83e094aa03df0b3f94e488

      - name: Build
        working-directory: dashboard
        run: npx @cloudflare/next-on-pages
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
          NODE_ENV: production

      - name: Deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ec77c7422c83e094aa03df0b3f94e488
          projectName: axto-dashboard
          directory: dashboard/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: "3"
