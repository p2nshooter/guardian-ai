name: AXTO Platform — Full Auto Deploy

# ─────────────────────────────────────────────────────────────────────────────
# Products built:
#   1. 🛡️  Guardian AI    → guardian-engine image (core API + node agent + ClamAV antivirus)
#   2. ⚡  Orchestra AI   → orchestra-core + orchestra-worker-cpu + orchestra-worker-gpu
#   3. 📦  Bundle         → Guardian + Orchestra (all 4 images)
#
# Pipeline:
#   1. guardian-engine          → GHCR  (amd64 + arm64)
#   2. orchestra-core           → GHCR  (amd64 + arm64)
#   3. orchestra-worker-cpu     → GHCR  (amd64 + arm64)
#   4. orchestra-worker-gpu     → GHCR  (amd64 + arm64)
#   5. D1 migrations (0001–0014)→ Cloudflare D1
#   6. Playbook PDFs (48 files) → Cloudflare R2
#   7. Sync R2 keys → D1        → Cloudflare D1
#   8. Secrets sync             → Cloudflare Pages
#   9. Build dashboard          → next-on-pages
#  10. Deploy dashboard         → Cloudflare Pages
#  11. Deploy Workers           → Cloudflare Workers
#
# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   JWT_SECRET, ENCRYPTION_KEY, ADMIN_PASSWORD, RESEND_API_KEY, CRON_SECRET
#
# Required GitHub Variable:
#   NEXT_PUBLIC_APP_URL = https://axto.io
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_docker:
        description: "Skip Docker builds (use existing GHCR images)"
        type: boolean
        default: false
      skip_pdfs:
        description: "Skip PDF upload (already in R2)"
        type: boolean
        default: false
      skip_deploy:
        description: "Build only — no Cloudflare deploy"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Build & Push Docker Images → GHCR
# 4 images: guardian-engine, orchestra-core, orchestra-worker-cpu, orchestra-worker-gpu
# Build tools (gcc, python3-dev) are installed then purged to keep images lean.
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build-docker:
    name: "🐳 Build ${{ matrix.image }}"
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_docker }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false          # build all 4 even if one fails
      matrix:
        include:
          # ── Guardian AI: core API + node agent + ClamAV antivirus ──────────
          - image: guardian-engine
            context: ./engine
            file: ./engine/Dockerfile
            product: "Guardian AI (core + node + ClamAV)"

          # ── Orchestra AI: orchestration core ──────────────────────────────
          - image: orchestra-core
            context: ./orchestra
            file: ./orchestra/Dockerfile
            product: "Orchestra AI (core)"

          # ── Orchestra AI: CPU worker (cloud AI providers) ─────────────────
          - image: orchestra-worker-cpu
            context: ./orchestra
            file: ./orchestra/Dockerfile.worker-cpu
            product: "Orchestra AI (CPU worker)"

          # ── Orchestra AI: GPU worker (local inference via Ollama) ──────────
          - image: orchestra-worker-gpu
            context: ./orchestra
            file: ./orchestra/Dockerfile.worker-gpu
            product: "Orchestra AI (GPU worker)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build & Push — ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=AXTO ${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.product }}
          # Layer cache — speeds up subsequent builds dramatically
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Increase build timeout for large images
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### 🐳 ${{ matrix.image }}" >> $GITHUB_STEP_SUMMARY
          echo "**Product:** ${{ matrix.product }}" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Platforms: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Deploy to Cloudflare (D1 + R2 + Pages + Workers)
# Runs after docker builds, even if some docker builds fail (always() + conditions)
# ═══════════════════════════════════════════════════════════════════════════════
  deploy-cloudflare:
    name: "☁️ Cloudflare Deploy"
    runs-on: ubuntu-latest
    needs: [build-docker]
    # Run if: not a PR, not skip_deploy, AND docker succeeded or was skipped
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      !inputs.skip_deploy &&
      (needs.build-docker.result == 'success' || needs.build-docker.result == 'skipped')
    permissions:
      contents: read
      deployments: write

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci --no-audit --no-fund

      # ── D1 Migrations 0001–0014 ─────────────────────────────────────────
      - name: "🗄️ D1 Migrations"
        working-directory: dashboard
        run: |
          echo "Running D1 migrations..."
          npx wrangler d1 migrations apply axto-db --remote
          echo "✅ Migrations applied"

      # ── R2 PDF Upload (48 playbooks) ────────────────────────────────────
      - name: "📦 PDFs → R2"
        if: ${{ !inputs.skip_pdfs }}
        working-directory: dashboard
        run: |
          PDF_DIR="../playbooks-pdf"
          BUCKET="axto-storage"
          UPLOADED=0
          FAILED=0

          if [ ! -d "$PDF_DIR" ] || [ -z "$(ls -A "$PDF_DIR"/*.pdf 2>/dev/null)" ]; then
            echo "⚠️  No PDFs found in $PDF_DIR — skipping"
            exit 0
          fi

          for pdf in "$PDF_DIR"/*.pdf; do
            [ -f "$pdf" ] || continue
            slug="$(basename "${pdf%.pdf}")"
            key="playbooks/${slug}.pdf"
            echo "  ⬆ $slug → $key"
            if npx wrangler r2 object put "$BUCKET/$key" \
              --file="$pdf" \
              --content-type="application/pdf" 2>/dev/null; then
              UPLOADED=$((UPLOADED+1))
            else
              echo "  ⚠️  Failed: $slug"
              FAILED=$((FAILED+1))
            fi
          done

          echo "✅ R2: $UPLOADED uploaded, $FAILED failed"
          echo "### 📦 R2: $UPLOADED PDFs uploaded" >> $GITHUB_STEP_SUMMARY

      # ── Sync R2 metadata → D1 ──────────────────────────────────────────
      - name: "🔗 Sync R2 metadata → D1"
        working-directory: dashboard
        run: |
          PDF_DIR="../playbooks-pdf"
          COUNT=0
          [ -d "$PDF_DIR" ] || exit 0

          for pdf in "$PDF_DIR"/*.pdf; do
            [ -f "$pdf" ] || continue
            slug="$(basename "${pdf%.pdf}")"
            key="playbooks/${slug}.pdf"
            size=$(stat -c%s "$pdf" 2>/dev/null || stat -f%z "$pdf" 2>/dev/null || echo "0")
            npx wrangler d1 execute axto-db --remote \
              --command="UPDATE playbooks SET r2_key='${key}', file_size_bytes=${size}, file_format='pdf', updated_at=datetime('now') WHERE slug='${slug}';" \
              2>/dev/null || true
            COUNT=$((COUNT+1))
          done
          echo "✅ D1 metadata synced for $COUNT playbooks"

      # ── Cloudflare Pages Secrets ────────────────────────────────────────
      - name: "🔐 Sync Secrets → CF Pages"
        working-directory: dashboard
        run: |
          sync_secret() {
            local name="$1" val="$2"
            if [ -n "$val" ]; then
              echo "$val" | npx wrangler pages secret put "$name" \
                --project-name=axto-dashboard 2>/dev/null \
                && echo "  ✅ $name" \
                || echo "  ⚠️  $name skipped"
            else
              echo "  ⚠️  $name not set in GitHub Secrets"
            fi
          }
          sync_secret JWT_SECRET         "${{ secrets.JWT_SECRET }}"
          sync_secret ENCRYPTION_KEY     "${{ secrets.ENCRYPTION_KEY }}"
          sync_secret ADMIN_PASSWORD     "${{ secrets.ADMIN_PASSWORD }}"
          sync_secret RESEND_API_KEY     "${{ secrets.RESEND_API_KEY }}"
          sync_secret CRON_SECRET        "${{ secrets.CRON_SECRET }}"
          sync_secret GHCR_OWNER        "${{ github.repository_owner }}"

      # ── Build Next.js Dashboard ─────────────────────────────────────────
      - name: "🔨 Build Dashboard"
        working-directory: dashboard
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}
          NEXT_PUBLIC_GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          npx @cloudflare/next-on-pages
          echo "✅ Dashboard built"

      # ── Deploy → Cloudflare Pages ───────────────────────────────────────
      - name: "🚀 Deploy → Cloudflare Pages"
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: axto-dashboard
          directory: dashboard/.vercel/output/static
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      # ── Deploy Cloudflare Workers ───────────────────────────────────────
      - name: "⚡ Deploy CF Workers"
        working-directory: cloudflare-workers
        run: |
          if [ -f "wrangler-autopost.toml" ]; then
            npx wrangler deploy --config wrangler-autopost.toml \
              && echo "  ✅ autopost-cron deployed" \
              || echo "  ⚠️  autopost-cron failed (non-fatal)"
            [ -n "${{ secrets.CRON_SECRET }}" ] && \
              echo "${{ secrets.CRON_SECRET }}" | \
              npx wrangler secret put CRON_SECRET \
                --config wrangler-autopost.toml 2>/dev/null || true
          fi
          if [ -f "wrangler-threat-intel.toml" ]; then
            npx wrangler deploy --config wrangler-threat-intel.toml \
              && echo "  ✅ threat-intel-sync deployed" \
              || echo "  ⚠️  threat-intel-sync failed (non-fatal)"
          fi

      # ── Final Summary ───────────────────────────────────────────────────
      - name: "📋 Deploy Summary"
        if: always()
        run: |
          PDF_COUNT=$(ls playbooks-pdf/*.pdf 2>/dev/null | wc -l || echo "0")
          APP_URL="${{ vars.NEXT_PUBLIC_APP_URL || 'https://axto.io' }}"
          OWNER="${{ github.repository_owner }}"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              ✅  AXTO Platform Deploy Complete              ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  DOCKER IMAGES → GHCR                                      ║"
          echo "║  🛡️  guardian-engine       (Guardian: core + node + ClamAV) ║"
          echo "║  ⚡  orchestra-core        (Orchestra: API server)          ║"
          echo "║  ⚡  orchestra-worker-cpu  (Orchestra: cloud AI worker)     ║"
          echo "║  ⚡  orchestra-worker-gpu  (Orchestra: local GPU worker)    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  CLOUDFLARE                                                 ║"
          echo "║  🗄️  D1 migrations 0001–0014 applied                        ║"
          echo "║  📦  Playbook PDFs: ${PDF_COUNT} files → R2                    ║"
          echo "║  🔐  Secrets synced to CF Pages                             ║"
          echo "║  ⚡  Cloudflare Workers deployed                             ║"
          echo "║  🌐  Dashboard: ${APP_URL}                    ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  REGISTRIES                                                 ║"
          echo "║  ghcr.io/${OWNER}/guardian-engine:latest         ║"
          echo "║  ghcr.io/${OWNER}/orchestra-core:latest          ║"
          echo "║  ghcr.io/${OWNER}/orchestra-worker-cpu:latest    ║"
          echo "║  ghcr.io/${OWNER}/orchestra-worker-gpu:latest    ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

          echo "### 🚀 AXTO Platform — Deploy Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🐳 Docker Images (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Product | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`guardian-engine\` | Guardian AI (core + node + ClamAV) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| \`orchestra-core\` | Orchestra AI (API server) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| \`orchestra-worker-cpu\` | Orchestra AI (cloud worker) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| \`orchestra-worker-gpu\` | Orchestra AI (GPU worker) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ☁️ Cloudflare" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| D1 Migrations (0014) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| R2 Playbook PDFs (${PDF_COUNT} files) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare Pages Dashboard | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloudflare Workers | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live:** ${APP_URL}" >> $GITHUB_STEP_SUMMARY
          echo "📦 **GHCR:** \`ghcr.io/${OWNER}/\`" >> $GITHUB_STEP_SUMMARY
