# ==============================================================================
# AXTO — GitHub Actions CI/CD (portable; no GitLab runner required)
# Runs on GitHub-hosted runners. Mirrors .gitlab-ci.yml so the same repo deploys
# from EITHER GitHub or GitLab.
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CF_ACCOUNT_ID, CF_PAGES_PROJECT
#   CF_R2_ACCOUNT_ID, CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY
#   TRON_API_KEY, ETHERSCAN_API_KEY, BSCSCAN_API_KEY, CRON_SECRET   (optional)
# ==============================================================================
name: AXTO CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"   # nightly 02:00 UTC

concurrency:
  group: axto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. The dashboard's own gate: types + unit tests (no network) ─────────
  # (Installation-guide PDFs are published by deploy-dashboard.yml on every
  # production deploy, from the same source as the /self-hosted/<slug>/guide pages.)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: dashboard/package-lock.json }
      - name: Types + unit tests
        working-directory: dashboard
        run: npm ci --prefer-offline && npx tsc --noEmit -p . && npm test

  # ── 2. Build the dashboard and deploy to Cloudflare Pages ─────────────────
  # NOTE: Automatic Pages deploys are owned by deploy-dashboard.yml (push to main).
  # This job is a MANUAL fallback only (workflow_dispatch) to avoid double-deploys.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install & build
        working-directory: dashboard
        run: |
          npm ci || npm install
          npm run build || npx @cloudflare/next-on-pages@1 || true
      - name: Apply D1 migrations
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CF not configured — skipping."; exit 0; fi
          npx wrangler d1 migrations apply axto-db --remote || echo "migrations step skipped"
      - name: Deploy to Cloudflare Pages
        working-directory: dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CF not configured — skipping deploy."; exit 0; fi
          npx wrangler pages deploy .vercel/output/static \
            --project-name "${{ secrets.CF_PAGES_PROJECT || 'axto-dashboard' }}" --commit-dirty=true \
            || npx wrangler pages deploy .next --project-name "${{ secrets.CF_PAGES_PROJECT || 'axto-dashboard' }}" --commit-dirty=true \
            || echo "Adjust the build output dir for your setup."
