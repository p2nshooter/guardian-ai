# AXTO Platform — Auto Build ALL Docker Images → CF R2
#
# Smart rebuild: Only builds products whose source directory changed.
# Use workflow_dispatch with force_all=true to rebuild everything.
#
# Products (10 images, GPU worker separate):
#   Guardian: core, node, antivirus | Orchestra: core, worker-cpu
#   Vault | Edge | SOC | Compliance | Sentinel | Studio
#
# Secrets: CF_R2_ACCESS_KEY_ID, CF_R2_SECRET_ACCESS_KEY, CF_R2_ACCOUNT_ID, CF_R2_BUCKET
# ═══════════════════════════════════════════════════════════════════════════════

name: Auto Build All Images

on:
  push:
    branches: [main]
    paths: ['engine/**','antivirus/**','orchestra/**','vault/**','edge/**','soc/**','compliance/**','sentinel/**','studio/**','ai-studio/**','gpu-studio/**','hybrid-studio/**','legal/**','yp/**','.github/workflows/auto-build-all.yml']
  workflow_dispatch:
    inputs:
      force_all: { description: 'Force rebuild ALL', required: false, default: 'false' }

concurrency:
  group: auto-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: "🔍 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      guardian: ${{ steps.f.outputs.guardian }}
      antivirus: ${{ steps.f.outputs.antivirus }}
      orchestra: ${{ steps.f.outputs.orchestra }}
      vault: ${{ steps.f.outputs.vault }}
      edge: ${{ steps.f.outputs.edge }}
      soc: ${{ steps.f.outputs.soc }}
      compliance: ${{ steps.f.outputs.compliance }}
      sentinel: ${{ steps.f.outputs.sentinel }}
      studio: ${{ steps.f.outputs.studio }}
      ai_studio: ${{ steps.f.outputs.ai_studio }}
      gpu_studio: ${{ steps.f.outputs.gpu_studio }}
      hybrid_studio: ${{ steps.f.outputs.hybrid_studio }}
      legal: ${{ steps.f.outputs.legal }}
      yp: ${{ steps.f.outputs.yp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            guardian: ['engine/**']
            antivirus: ['antivirus/**']
            orchestra: ['orchestra/**']
            vault: ['vault/**']
            edge: ['edge/**']
            soc: ['soc/**']
            compliance: ['compliance/**']
            sentinel: ['sentinel/**']
            studio: ['studio/**']
            ai_studio: ['ai-studio/**']
            gpu_studio: ['gpu-studio/**']
            hybrid_studio: ['hybrid-studio/**']
            legal: ['legal/**']
            yp: ['yp/**']

  build-guardian-core:
    name: "🛡️ Guardian Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.guardian == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./engine, dockerfile: ./engine/Dockerfile, image_name: guardian-core }
    secrets: inherit

  build-guardian-node:
    name: "🤖 Guardian Node"
    needs: detect-changes
    if: needs.detect-changes.outputs.guardian == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./engine, dockerfile: ./engine/Dockerfile.node, image_name: guardian-node }
    secrets: inherit

  build-guardian-antivirus:
    name: "🦠 Antivirus"
    needs: detect-changes
    if: needs.detect-changes.outputs.antivirus == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./antivirus, dockerfile: ./antivirus/Dockerfile, image_name: guardian-antivirus }
    secrets: inherit

  build-orchestra-core:
    name: "⚡ Orchestra Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestra == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./orchestra, dockerfile: ./orchestra/Dockerfile, image_name: orchestra-core }
    secrets: inherit

  build-orchestra-worker-cpu:
    name: "💻 Orchestra CPU Worker"
    needs: detect-changes
    if: needs.detect-changes.outputs.orchestra == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./orchestra, dockerfile: ./orchestra/Dockerfile.worker-cpu, image_name: orchestra-worker-cpu }
    secrets: inherit

  build-vault-core:
    name: "🔐 Vault Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.vault == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./vault, dockerfile: ./vault/Dockerfile, image_name: vault-core }
    secrets: inherit

  build-edge-core:
    name: "🌐 Edge Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.edge == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./edge, dockerfile: ./edge/Dockerfile, image_name: edge-core }
    secrets: inherit

  build-soc-core:
    name: "🎯 SOC Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.soc == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./soc, dockerfile: ./soc/Dockerfile, image_name: soc-core }
    secrets: inherit

  build-compliance-core:
    name: "📋 Compliance Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.compliance == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./compliance, dockerfile: ./compliance/Dockerfile, image_name: compliance-core }
    secrets: inherit

  build-sentinel-core:
    name: "🏭 Sentinel Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.sentinel == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./sentinel, dockerfile: ./sentinel/Dockerfile, image_name: sentinel-core }
    secrets: inherit

  build-studio-core:
    name: "🧠 Studio Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.studio == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./studio, dockerfile: ./studio/Dockerfile, image_name: studio-core }
    secrets: inherit

  build-ai-studio:
    name: "🧠 AI Studio"
    needs: detect-changes
    if: needs.detect-changes.outputs.ai_studio == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./ai-studio, dockerfile: ./ai-studio/Dockerfile, image_name: ai-studio }
    secrets: inherit

  build-gpu-studio:
    name: "🎨 GPU Studio"
    needs: detect-changes
    if: needs.detect-changes.outputs.gpu_studio == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./gpu-studio, dockerfile: ./gpu-studio/Dockerfile, image_name: gpu-studio }
    secrets: inherit

  build-hybrid-studio:
    name: "⚡ Hybrid Studio"
    needs: detect-changes
    if: needs.detect-changes.outputs.hybrid_studio == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./hybrid-studio, dockerfile: ./hybrid-studio/Dockerfile, image_name: hybrid-studio }
    secrets: inherit

  build-legal-core:
    name: "⚖️ Legal Core"
    needs: detect-changes
    if: needs.detect-changes.outputs.legal == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./legal, dockerfile: ./legal/Dockerfile, image_name: legal-core }
    secrets: inherit

  build-yp-core:
    name: "🚀 Yusron Power"
    needs: detect-changes
    if: needs.detect-changes.outputs.yp == 'true' || github.event.inputs.force_all == 'true'
    uses: ./.github/workflows/_build-image.yml
    with: { context: ./yp, dockerfile: ./yp/Dockerfile, image_name: yp-core }
    secrets: inherit

  summary:
    name: "📊 Summary"
    needs: [build-guardian-core,build-guardian-node,build-guardian-antivirus,build-orchestra-core,build-orchestra-worker-cpu,build-vault-core,build-edge-core,build-soc-core,build-compliance-core,build-sentinel-core,build-studio-core,build-ai-studio,build-gpu-studio,build-hybrid-studio,build-legal-core,build-yp-core]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: |
          echo "═══ AXTO Build Results ═══"
          echo "Guardian Core: ${{ needs.build-guardian-core.result }}"
          echo "Guardian Node: ${{ needs.build-guardian-node.result }}"
          echo "Antivirus:     ${{ needs.build-guardian-antivirus.result }}"
          echo "Orchestra:     ${{ needs.build-orchestra-core.result }}"
          echo "Orchestra CPU: ${{ needs.build-orchestra-worker-cpu.result }}"
          echo "Vault:         ${{ needs.build-vault-core.result }}"
          echo "Edge:          ${{ needs.build-edge-core.result }}"
          echo "SOC:           ${{ needs.build-soc-core.result }}"
          echo "Compliance:    ${{ needs.build-compliance-core.result }}"
          echo "Sentinel:      ${{ needs.build-sentinel-core.result }}"
          echo "Studio:        ${{ needs.build-studio-core.result }}"
          echo "AI Studio:     ${{ needs.build-ai-studio.result }}"
          echo "GPU Studio:    ${{ needs.build-gpu-studio.result }}"
          echo "Hybrid Studio: ${{ needs.build-hybrid-studio.result }}"
          echo "Legal:         ${{ needs.build-legal-core.result }}"
          echo "══════════════════════════"
