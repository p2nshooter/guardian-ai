# AXTO Edge — GitHub Actions: Auto Build + Upload R2
# Triggers: push to main | repository_dispatch (from admin dashboard)
# ═══════════════════════════════════════════════════════════════════════════════
name: Build Edge Core

on:
  push:
    branches: [main]
    paths:
      - "edge/**"
      - ".github/workflows/build-edge.yml"
  workflow_dispatch:
    inputs:
      build_id:    { description: "Build ID",            required: false, default: "" }
      callback_url: { description: "Dashboard callback",  required: false, default: "" }
      callback_secret: { description: "Webhook secret",  required: false, default: "" }
  repository_dispatch:
    types: [build_product]

concurrency:
  group: build-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-edge-core:
    name: "🌐 Edge Core"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./edge
          file: ./edge/Dockerfile
          push: false
          load: true
          tags: axto/edge-core:latest
          cache-from: type=gha,scope=edge-core
          cache-to: type=gha,mode=max,scope=edge-core

      - name: Save & upload to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_ACCOUNT_ID:         ${{ secrets.CF_R2_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.CF_R2_BUCKET }}
        run: |
          echo "💾 Saving edge-core..."
          docker save axto/edge-core:latest | gzip -9 > edge-core.tar.gz
          echo "✅ $(du -sh edge-core.tar.gz | cut -f1)"

          pip install -q "awscli>=1.32"

          # Upload versioned
          SHA="${{ github.sha }}"
          aws s3 cp edge-core.tar.gz \
            "s3://${R2_BUCKET}/builds/${SHA:0:8}/raw/edge-core.tar.gz" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --metadata "product=edge-core,commit=${SHA:0:8}" \
            --no-progress

          # Upload latest
          aws s3 cp edge-core.tar.gz \
            "s3://${R2_BUCKET}/builds/latest/raw/edge-core.tar.gz" \
            --endpoint-url "https://${CF_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --metadata "product=edge-core,commit=${SHA:0:8}" \
            --no-progress

          echo "☁️  Uploaded → builds/latest/raw/edge-core.tar.gz"

      - name: Notify dashboard
        if: always()
        env:
          AXTO_APP_URL:         ${{ secrets.AXTO_APP_URL }}
          BUILD_WEBHOOK_SECRET: ${{ secrets.BUILD_WEBHOOK_SECRET }}
          CALLBACK_URL:         ${{ github.event.client_payload.callback_url || inputs.callback_url }}
          CALLBACK_SECRET:      ${{ github.event.client_payload.callback_secret || inputs.callback_secret }}
        run: |
          TARGET="${CALLBACK_URL:-$AXTO_APP_URL/api/admin/engine-builder}"
          SECRET="${CALLBACK_SECRET:-$BUILD_WEBHOOK_SECRET}"
          STATUS="${{ job.status == 'success' && 'success' || 'failed' }}"
          if [ -n "$TARGET" ]; then
            curl -sf --max-time 15 -X POST "$TARGET" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${SECRET}" \
              -d "{\"action\":\"build_callback\",\"product\":\"edge-core\",\"type\":\"image\",\"status\":\"${STATUS}\",\"commit\":\"${{ github.sha }}\"}" \
              || echo "⚠️ Callback failed (non-fatal)"
          fi
