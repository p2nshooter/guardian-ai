# ============================================================
# AXTO — Cloudflare Worker: Threat Feed CDN
# Worker ini menyajikan threat feed data dari R2
# dan memvalidasi license key via D1 / Dashboard API.
# ============================================================
name = "axto-threat-feed"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── R2 Bucket (Threat Feed data) ────────────────────────────
[[r2_buckets]]
binding             = "THREAT_FEED"
bucket_name         = "guardian-threat-feed"
preview_bucket_name = "guardian-threat-feed-dev"

# ── KV Namespace (License cache) ────────────────────────────
# ID diisi otomatis oleh setup.sh dan deploy.yml
[[kv_namespaces]]
binding    = "LICENSE_CACHE"
id         = "PLACEHOLDER_WILL_BE_SET_BY_SETUP"
preview_id = "PLACEHOLDER_WILL_BE_SET_BY_SETUP"

# ── Durable Objects (Rate Limiter) ───────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag         = "v1"
new_classes = ["RateLimiter"]

# ── Environment: Production ─────────────────────────────────
[env.production]
name = "axto-threat-feed-prod"

[env.production.vars]
ENVIRONMENT    = "production"
ALLOWED_ORIGIN = "*"
CACHE_TTL      = "3600"

[[env.production.durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiter"

# ── Secrets (jangan hardcode di sini) ───────────────────────
# Set via CLI atau setup.sh:
#   wrangler secret put CF_LICENSE_SECRET --env production
#   wrangler secret put DASHBOARD_URL      --env production
