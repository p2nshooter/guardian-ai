version: "3.9"

# ============================================================
# AXTO Edge — AI Gateway & API Management
# docker compose -f edge-compose.yml up -d
# ============================================================

services:
  edge-core:
    image: registry.gitlab.com/axto-platform/edge/edge-engine:latest
    container_name: edge-core
    restart: unless-stopped
    ports:
      - "8094:8094"
    volumes:
      - ./edge.yml:/edge/config/edge.yml:ro
      - edge-data:/edge/data
      - edge-logs:/edge/logs
    environment:
      - EDGE_CONFIG=/edge/config/edge.yml
      - EDGE_PORT=8094
    healthcheck:
      test: ["CMD","curl","-sf","http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - edge-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  edge-data:
  edge-logs:

networks:
  edge-net:
    driver: bridge
