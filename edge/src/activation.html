<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXTO Edge — Activation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#030a14;color:#f1f5f9;font-family:'Inter',-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.wrap{max-width:500px;width:100%;text-align:center}
.icon{width:80px;height:80px;background:linear-gradient(135deg,#0891b2,#0284c7);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 28px;box-shadow:0 8px 32px rgba(8,145,178,.4)}
h1{font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:8px}
h1 span{background:linear-gradient(135deg,#22d3ee,#0891b2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{color:#64748b;font-size:14px;line-height:1.7;margin-bottom:36px}
.box{background:rgba(8,145,178,.06);border:1px solid rgba(8,145,178,.2);border-radius:18px;padding:28px;text-align:left;margin-bottom:24px}
.box-title{font-size:13px;font-weight:700;color:#22d3ee;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.step{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(8,145,178,.1)}
.step:last-child{border-bottom:none;padding-bottom:0}
.step-num{width:24px;height:24px;border-radius:50%;background:rgba(8,145,178,.2);border:1px solid rgba(8,145,178,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#22d3ee;flex-shrink:0;margin-top:2px}
.step-text{font-size:13px;color:#94a3b8;line-height:1.6}
code{background:rgba(8,145,178,.12);padding:2px 7px;border-radius:5px;font-size:12px;color:#67e8f9;font-family:monospace}
form{display:flex;gap:10px}
input{flex:1;background:#0a1628;border:1px solid #1c2e44;border-radius:10px;padding:11px 14px;color:#f1f5f9;font-size:14px;outline:none;transition:border-color .15s}
input:focus{border-color:rgba(8,145,178,.5)}
input::placeholder{color:#475569}
.cta{padding:11px 24px;background:linear-gradient(135deg,#0891b2,#0284c7);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px rgba(8,145,178,.35);transition:filter .15s;white-space:nowrap}
.cta:hover{filter:brightness(1.1)}
#msg{margin-top:12px;font-size:13px;text-align:left;padding:8px 12px;border-radius:8px;display:none}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#f87171}
.ok{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);color:#34d399}
.portal-link{display:inline-block;margin-top:16px;color:#22d3ee;font-size:13px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">🔀</div>
  <h1>AXTO <span>Edge</span></h1>
  <p class="sub">AI Gateway &amp; BYOK Management Platform<br>Enter your license key to activate</p>

  <div class="box">
    <div class="box-title">How to Activate</div>
    <div class="step"><div class="step-num">1</div><div class="step-text">Purchase an Edge license at <a href="https://axto.io/register?pkg=edge" style="color:#22d3ee">axto.io</a> — Starter, Growth, or Enterprise</div></div>
    <div class="step"><div class="step-num">2</div><div class="step-text">Your license key starts with <code>EDGE-</code></div></div>
    <div class="step"><div class="step-num">3</div><div class="step-text">Enter the key below and click Activate</div></div>
  </div>

  <form onsubmit="activate(event)">
    <input type="text" id="key-input" placeholder="EDGE-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
    <button class="cta" type="submit">Activate</button>
  </form>
  <div id="msg"></div>
  <a href="https://axto.io/register?pkg=edge" target="_blank" class="portal-link">Get Edge License →</a>
</div>
<script>
async function activate(e){
  e.preventDefault();
  const key=document.getElementById('key-input').value.trim().toUpperCase();
  const msg=document.getElementById('msg');
  if(!key.startsWith('EDGE-')){msg.className='err';msg.textContent='Key must start with EDGE-';msg.style.display='block';return;}
  msg.className='';msg.textContent='Validating…';msg.style.display='block';msg.style.color='#94a3b8';
  try{
    const r=await fetch('/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({license_key:key})});
    if(r.ok){msg.className='ok';msg.textContent='✓ License activated! Reloading…';setTimeout(()=>location.href='/',2000);}
    else{const d=await r.json().catch(()=>({}));msg.className='err';msg.textContent='✗ '+(d.detail||'Invalid key');}
  }catch(err){msg.className='err';msg.textContent='✗ Network error: '+err.message;}
}
</script>
</body>
</html>
