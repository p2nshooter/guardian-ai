version: "3.9"
# ============================================================
# AXTO Vault — Tier 2 (PostgreSQL + Redis)
# For high-volume production: 100K+ scans/day
# docker compose -f vault-compose-tier2.yml up -d
# ============================================================
services:
  vault-core:
    image: axto/vault-core:latest
    container_name: axto-vault
    restart: unless-stopped
    ports: ["8081:8091"]
    volumes:
      - ./vault.yml:/vault/config/vault.yml:ro
      - vault-data:/vault/data
      - vault-logs:/vault/logs
    environment:
      - VAULT_CONFIG=/vault/config/vault.yml
      - VAULT_PORT=8091
      - VAULT_DB_URL=postgresql://vault:${POSTGRES_PASSWORD:-vault_change_me}@vault-postgres:5432/vault
      - VAULT_REDIS_URL=redis://:${REDIS_PASSWORD:-redis_change_me}@vault-redis:6379/0
    depends_on:
      vault-postgres: {condition: service_healthy}
      vault-redis:    {condition: service_healthy}
    healthcheck:
      test: ["CMD","curl","-sf","http://localhost:8091/health"]
      interval: 30s; timeout: 10s; retries: 3; start_period: 45s
    networks: [vault-net]
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5"}

  vault-postgres:
    image: postgres:16-alpine
    container_name: vault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - vault-postgres-data:/var/lib/postgresql/data
      - ./migrations/vault/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vault -d vault"]
      interval: 10s; timeout: 5s; retries: 5; start_period: 30s
    networks: [vault-net]

  vault-redis:
    image: redis:7-alpine
    container_name: vault-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_change_me}
      --loglevel warning
    volumes: [vault-redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD","redis-cli","--no-auth-warning","-a","${REDIS_PASSWORD:-redis_change_me}","ping"]
      interval: 10s; timeout: 5s; retries: 5
    networks: [vault-net]

volumes:
  vault-data:
  vault-logs:
  vault-postgres-data:
  vault-redis-data:

networks:
  vault-net:
    driver: bridge
