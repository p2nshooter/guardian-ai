version: "3.9"

# ============================================================
# AXTO Compliance — Automated Audit Platform
# docker compose -f compliance-compose.yml up -d
# ============================================================

services:
  compliance-core:
    image: registry.gitlab.com/axto-platform/compliance-engine/compliance-engine:latest
    container_name: compliance-core
    restart: unless-stopped
    ports:
      - "8084:8093"
    volumes:
      - ./compliance.yml:/compliance/config/compliance.yml:ro
      - compliance-data:/compliance/data
      - compliance-logs:/compliance/logs
    environment:
      - COMPLIANCE_CONFIG=/compliance/config/compliance.yml
      - COMPLIANCE_PORT=8093
    healthcheck:
      test: ["CMD","curl","-sf","http://localhost:8093/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - compliance-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  compliance-data:
  compliance-logs:

networks:
  compliance-net:
    driver: bridge
