# AXTO Orchestra — AI eXecution & Tools Orchestration | Config
#
# CARA PAKAI:
#   1. No licence needed (free program) — the app auto-registers
#   2. Isi minimal 1 AI vendor key
#   3. docker compose -f orchestra-compose.yml up -d
#
# Pull image: docker pull axto/orchestra-core:latest
# ============================================================

orchestra:

  # ── License ──────────────────────────────────────────────
  # Dapatkan dari: https://axto.io/portal
  license_key: ""   # FREE PROGRAM: no licence needed — leave empty, the app auto-registers this machine

  # Endpoint validasi license (jangan ubah)
  license_validate_url: "https://axto.io/api/license-validate"

  # ── Server ───────────────────────────────────────────────
  host: "0.0.0.0"
  port: 8080
  log_level: "INFO"

  # ── Database ─────────────────────────────────────────────
  # SQLite (default, zero config)
  database_url: "sqlite:///./data/orchestra.db"

  # PostgreSQL (recommended untuk production multi-node)
  # database_url: "postgresql://user:password@localhost:5432/orchestra"

  # ── AI Vendor Pool (BYOK) ─────────────────────────────────
  ai_pool:
    routing_mode: "cost_first"   # cost_first | quality_first | smart_balance | round_robin | local_first | failover
    budget_daily_usd: 50.0       # 0 = unlimited

    vendors:

      # OpenAI (Recommended)
      - provider: openai
        api_key: "sk-GANTI-INI"
        default_model: "gpt-4o-mini"

      # Anthropic Claude
      # - provider: anthropic
      #   api_key: "sk-ant-GANTI-INI"
      #   default_model: "claude-haiku-4-5-20251001"

      # Google Gemini
      # - provider: gemini
      #   api_key: "AIza-GANTI-INI"
      #   default_model: "gemini-2.0-flash"

      # Groq (ultra-cepat, murah)
      # - provider: groq
      #   api_key: "gsk_GANTI-INI"
      #   default_model: "llama-3.1-8b-instant"

      # DeepSeek (murah, reasoning bagus)
      # - provider: deepseek
      #   api_key: "sk-GANTI-INI"
      #   default_model: "deepseek-chat"

      # Mistral
      # - provider: mistral
      #   api_key: "GANTI-INI"
      #   default_model: "mistral-small-latest"

      # Ollama (lokal, gratis)
      # - provider: ollama
      #   base_url: "http://localhost:11434"
      #   default_model: "llama3"

  # ── Workers ───────────────────────────────────────────────
  workers:
    cpu:
      enabled: true
      count: 4
      max_queue: 100
    gpu:
      enabled: true
      auto_detect: true

  # ── Job Tiers ─────────────────────────────────────────────
  tiers:
    light:
      max_tokens: 512
      preferred_vendors: ["groq", "gemini", "deepseek"]
    medium:
      max_tokens: 2048
      preferred_vendors: ["deepseek", "gemini", "openai"]
    heavy:
      max_tokens: 8192
      preferred_vendors: ["anthropic", "openai", "mistral"]
    io:
      max_tokens: 512
      preferred_vendors: ["groq", "deepseek"]

  # ── Optional Security ─────────────────────────────────────
  # api_secret: "your-secret-key"
  # allow_origins: ["http://localhost:3000", "https://your-app.com"]
