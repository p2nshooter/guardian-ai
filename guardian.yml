# ============================================================
# GUARDIAN AI — Client Configuration
# 
# CARA PAKAI:
#   1. Isi license_key dari Client Portal
#   2. Isi minimal 1 AI vendor key
#   3. docker compose up -d
#
# Pull image: docker pull axto/guardian-core:latest
# ============================================================

guardian:

  # ── License ──────────────────────────────────────────────
  # Dapatkan dari: https://axto.io/portal
  license_key: "GUARDIAN-XXXX-XXXX-XXXX-XXXXXXXXXXXX"

  # Endpoint validasi license (jangan ubah)
  license_validate_url: "https://axto.io/api/license-validate"

  # ── Scan Mode ────────────────────────────────────────────
  # auto   → Scan otomatis setiap scan_interval detik
  # manual → Hanya scan jika di-trigger via API
  # off    → Nonaktifkan scan otomatis
  scan_mode: "auto"
  scan_interval: 300

  scan_paths:
    - /host
    - /tmp

  # ── AI Pool (BYOK — Bring Your Own Keys) ─────────────────
  # Isi minimal 1 vendor. Lebih banyak = coverage lebih baik.
  ai_pool:
    vendors:

      # OpenAI (Recommended)
      - provider: openai
        api_key: "sk-GANTI-INI"
        model: "gpt-4o-mini"

      # Anthropic Claude
      # - provider: anthropic
      #   api_key: "sk-ant-GANTI-INI"
      #   model: "claude-haiku-4-5-20251001"

      # Google Gemini
      # - provider: gemini
      #   api_key: "AIza-GANTI-INI"
      #   model: "gemini-2.0-flash"

      # Groq (gratis, ultra-cepat)
      # - provider: groq
      #   api_key: "gsk_GANTI-INI"
      #   model: "llama-3.1-8b-instant"

      # Ollama (lokal, gratis)
      # - provider: ollama
      #   base_url: "http://ollama:11434"
      #   model: "llama3"

  # ── Optional ─────────────────────────────────────────────
  # heartbeat_interval: 3600

  # ── TIER 2: Distributed Database (PostgreSQL + Redis) ──────────────────────
  # Uncomment dan isi untuk mengaktifkan Tier 2 features:
  # - PostgreSQL: shared multi-node DB, audit log, attack graph storage
  # - Redis: real-time pub/sub alerts, threat cache < 1ms, distributed lock
  #
  # Cara aktivasi:
  #   1. docker compose --profile tier2 up -d   (start postgres + redis)
  #   2. Uncomment blok tier2 di bawah
  #   3. docker compose restart guardian-core

  # tier2:
  #   db_mode: distributed
  #   postgres_url: "postgresql://guardian:guardian_change_in_prod@guardian-postgres:5432/guardian"
  #   redis_url: "redis://:guardian_redis_change_in_prod@guardian-redis:6379/0"
  #
  #   # mTLS: encrypt + authenticate node-to-core traffic
  #   # Generate certs: python -m src.mtls gen-ca && python -m src.mtls gen-node node-1
  #   mtls:
  #     enabled: false
  #     cert_path: /guardian/certs/node.crt
  #     key_path:  /guardian/certs/node.key
  #     ca_path:   /guardian/certs/ca.crt
  #
  #   # eBPF: kernel-level monitoring (unstoppable by userspace malware)
  #   # Requires: Linux + apt-get install python3-bcc + root
  #   ebpf_enabled: false
