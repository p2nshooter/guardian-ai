# AXTO Orchestra — AI eXecution & Tools Orchestration | Docker Compose
# Usage:
#   1. cp orchestra.example.yml orchestra.yml
#   2. Edit orchestra.yml (license_key + AI vendor keys)
#   3. docker compose -f orchestra-compose.yml up -d
#
# Orchestra Core API: http://localhost:8088
# Orchestra Console:  http://localhost:8088/console
# ============================================================

services:

  orchestra-core:
    image: axto/orchestra-core:latest
    container_name: orchestra-core
    restart: unless-stopped
    ports:
      - "8088:8080"       # Orchestra Core API + Console UI
    volumes:
      - ./orchestra.yml:/app/orchestra_core/config/orchestra.yml:ro
      - orchestra-data:/app/data
      - orchestra-logs:/app/logs
    environment:
      - ORCHESTRA_HOST=0.0.0.0
      - ORCHESTRA_PORT=8080
      - ORCHESTRA_LOG_LEVEL=INFO
      # Leave empty to use orchestra.yml; secrets not set anywhere are generated
      # on first start (printed once in `docker logs orchestra-core`).
      - AXTO_LICENSE_KEY=${AXTO_LICENSE_KEY:-}
      - ORCHESTRA_CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - ORCHESTRA_WORKER_TOKEN=${WORKER_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - orchestra-net
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "5" }

  orchestra-worker-cpu:
    image: axto/orchestra-worker-cpu:latest
    container_name: orchestra-worker-cpu-1
    restart: unless-stopped
    depends_on:
      orchestra-core:
        condition: service_healthy
    environment:
      - ORCHESTRA_CORE_URL=http://orchestra-core:8080
      - ORCHESTRA_WORKER_TOKEN=${WORKER_TOKEN:-}
      - ORCHESTRA_CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - WORKER_PROVIDER=${WORKER_PROVIDER:-groq}
      - WORKER_MODEL=${WORKER_MODEL:-llama-3.1-8b-instant}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-4}
      - WORKER_PORT=7891
      - NODE_ID=cpu-node-1
    volumes:
      # Same volume as the core, read-only: tokens and the encrypted BYOK vault.
      - orchestra-data:/app/data:ro
    networks:
      - orchestra-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── GPU worker (NVIDIA) — only with the "gpu" profile ─────────────────────
  # (AMD on Linux: the "gpu-amd" profile below — the same image built for ROCm.)
  # Image axto/orchestra-worker-gpu (≈ 6 GB: CUDA PyTorch, Whisper, SDXL,
  # embeddings). AXTO Setup starts it when "GPU worker" is ticked (CLI: --gpu);
  # by hand: docker compose -f orchestra-compose.yml --profile gpu up -d
  # Needs the NVIDIA driver (+ nvidia-container-toolkit on Linux; Docker
  # Desktop on Windows passes the GPU through WSL 2). Chat on local models goes
  # to Ollama on the host (OLLAMA_BASE_URL), everything else runs in here.
  orchestra-worker-gpu:
    image: axto/orchestra-worker-gpu:latest
    container_name: orchestra-worker-gpu-1
    profiles: ["gpu"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      orchestra-core:
        condition: service_healthy
    environment:
      - ORCHESTRA_CORE_URL=http://orchestra-core:8080
      - ORCHESTRA_WORKER_TOKEN=${WORKER_TOKEN:-}
      - ORCHESTRA_CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - WORKER_MODEL=${GPU_WORKER_MODEL:-llama3.2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WORKER_PORT=7892
      - NODE_ID=gpu-node-1
      # Address orchestra-core uses to POST GPU tasks to this worker's /run.
      - WORKER_SELF_URL=http://orchestra-worker-gpu-1:7892
      # Hugging Face models (Whisper, SDXL, embeddings) are kept in a volume.
      - HF_HOME=/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orchestra-data:/app/data:ro
      - orchestra-models:/app/models
    networks:
      - orchestra-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

  # ── GPU worker (AMD, Linux) — only with the "gpu-amd" profile ─────────────
  # Image axto/orchestra-worker-gpu-amd: the same image as the NVIDIA worker with
  # PyTorch for ROCm 6.2 (REQUESTS 136 G3). AXTO Setup starts it when the host has
  # /dev/kfd, an AMD render node and the amdgpu driver, after a GPU test inside the
  # image; by hand: docker compose -f orchestra-compose.yml --profile gpu-amd up -d
  # Docker Desktop on Windows cannot pass AMD GPUs into containers: there, Ollama on
  # the host uses the card and Orchestra reaches it through an Ollama worker.
  # Consumer Radeon cards that ROCm does not list may need HSA_OVERRIDE_GFX_VERSION
  # (e.g. 10.3.0 for RX 6000) in the environment below.
  orchestra-worker-gpu-amd:
    image: axto/orchestra-worker-gpu-amd:latest
    container_name: orchestra-worker-gpu-amd-1
    profiles: ["gpu-amd"]
    restart: unless-stopped
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
    depends_on:
      orchestra-core:
        condition: service_healthy
    environment:
      - ORCHESTRA_CORE_URL=http://orchestra-core:8080
      - ORCHESTRA_WORKER_TOKEN=${WORKER_TOKEN:-}
      - ORCHESTRA_CONSOLE_PASSWORD=${CONSOLE_PASSWORD:-}
      - WORKER_MODEL=${GPU_WORKER_MODEL:-llama3.2}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - WORKER_PORT=7892
      - NODE_ID=gpu-amd-node-1
      - WORKER_LABEL=GPU Worker (AMD)
      # Address orchestra-core uses to POST GPU tasks to this worker's /run.
      - WORKER_SELF_URL=http://orchestra-worker-gpu-amd-1:7892
      - HF_HOME=/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - orchestra-data:/app/data:ro
      - orchestra-models:/app/models
    networks:
      - orchestra-net
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }

volumes:
  orchestra-data:
  orchestra-logs:
  orchestra-models:

networks:
  orchestra-net:
    driver: bridge
