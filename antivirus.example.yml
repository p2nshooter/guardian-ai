antivirus:

  # ── License ──────────────────────────────────────────────
  license_key: "AV-XXXX-XXXX-XXXX-XXXXXXXXXXXX"
  license_validate_url: "https://axto.io/api/license-validate"

  # ── ClamAV Engine ────────────────────────────────────────
  clamd_host: "clamav"
  clamd_port: 3310

  # ── Storage ───────────────────────────────────────────────
  data_dir: /guardian/data
  db_path: /guardian/data/antivirus.db
  quarantine_dir: /guardian/data/quarantine
  max_file_size_mb: 500

  # ── Webhook (Optional) ───────────────────────────────────
  # Kirim notifikasi saat file berbahaya terdeteksi
  # Send notification when a malicious file is detected
  # webhook_url: "https://your-server.com/webhook/av-alerts"

  # ── AI Pool (BYOK — Optional AI-assisted analysis) ────────
  ai_pool:
    vendors: []
